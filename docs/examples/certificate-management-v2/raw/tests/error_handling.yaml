## This code was partially generated using artificial intelligence (AI) (Tool: Copilot, Model: Claude Opus 4.6).
## It was reviewed and tested by a human committer.

kind: test
syntax: v2

id: error-handling
namespace: certificate-management-tck

metadata:
  name: "Error Handling"
  version: "1.0"
  description: >
    Verify CX-0135 error handling: Test 1 sends a request with an unknown
    certificate type expecting REJECTED with proper envelope. Test 2 sends
    a malformed body (missing header) expecting HTTP 500.

execution:
  - id: pull_notification_endpoint
    uses: connector/pull_data_filtered
    name: Discover CCMAPI offer and obtain dataplane credentials
    with:
      connector_service: ${{ infrastructure.engine.connector }}
      counter_party_address: ${{ infrastructure.sut.connector.counter_party_address }}
      counter_party_id: ${{ infrastructure.sut.connector.counter_party_id }}
      policy: ${{ env.ccm_usage_policy.policy }}
      filters:
        - operand_left: "'http://purl.org/dc/terms/type'.'@id'"
          operator: "="
          operand_right: "https://w3id.org/catenax/taxonomy#CCMAPI"
        - operand_left: "'http://purl.org/dc/terms/subject'.'@id'"
          operator: "="
          operand_right: "https://w3id.org/catenax/taxonomy#CompanyCertificateManagementNotificationApi"
        - operand_left: "https://w3id.org/catenax/ontology/common#version"
          operator: "="
          operand_right: "3.0"
    returns:
      catalog:
        type: object
        class: Catalog
      datasets:
        type: object
        class: Datasets
      asset_id:
        type: string
        class: AssetId
      negotiation_id:
        type: string
        class: NegotiationId
      transfer_process_id:
        type: string
        class: TransferId
      edr_token:
        type: string
        class: AuthToken
      dataplane_url:
        type: string
        class: DataplaneUrl
    validate:
      - uses: validate/assert
        with: { input: datasets, operator: not_null }
      - uses: validate/assert
        with: { input: asset_id, operator: not_null }
      - uses: validate/assert
        with: { input: negotiation_id, operator: not_null }
      - uses: validate/assert
        with: { input: transfer_process_id, operator: not_null }
      - uses: validate/assert
        with: { input: edr_token, operator: not_null }
      - uses: validate/assert
        with: { input: dataplane_url, operator: not_null }

  - id: gen_err_message_id
    uses: util/generate_uuid
    name: Generate message ID for rejected request
    returns:
      generated_id:
        type: string
        class: Uuid

  - id: send_unknown_cert_type
    uses: connector/dataplane/http_request
    name: >
      Send request with nonexistent certificate type — SUT must return
      REJECTED with proper CX-0135 header envelope
    with:
      method: POST
      dataplane_url: "${{ steps.pull_notification_endpoint.dataplane_url }}"
      path: "/companycertificate/request"
      edr_token: "${{ steps.pull_notification_endpoint.edr_token }}"
      headers:
        Content-Type: "application/json"
      body: "${{ testdata.error_unknown_cert_type_body }}"
    returns:
      status_code:
        type: integer
        class: StatusCode
      response_body:
        type: object
        class: ResponseBody
    validate:
      - uses: validate/assert
        with: { input: status_code, operator: equals, value: 200 }
      - uses: validate/field
        with:
          input: response_body
          path: "header.messageId"
          operator: matches_regex
          value: "^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      - uses: validate/field
        with:
          input: response_body
          path: "header.context"
          operator: equals
          value: "CompanyCertificateManagement-CCMAPI-Request:1.0.0"
      - uses: validate/field
        with:
          input: response_body
          path: "header.relatedMessageId"
          operator: equals
          value: "urn:uuid:${{ steps.gen_err_message_id.generated_id }}"
      - uses: validate/field
        with:
          input: response_body
          path: "header.version"
          operator: equals
          value: "3.1.0"
      - uses: validate/field
        with:
          input: response_body
          path: "header.senderBpn"
          operator: matches_regex
          value: "^BPNL[0-9A-Z]{12}$"
      - uses: validate/field
        with:
          input: response_body
          path: "content.requestStatus"
          operator: equals
          value: "REJECTED"

  - id: send_malformed_request
    uses: connector/dataplane/http_request
    name: Send malformed request body without header field — SUT must return HTTP 500
    with:
      method: POST
      dataplane_url: "${{ steps.pull_notification_endpoint.dataplane_url }}"
      path: "/companycertificate/request"
      edr_token: "${{ steps.pull_notification_endpoint.edr_token }}"
      headers:
        Content-Type: "application/json"
      body:
        content:
          certifiedBpn: "${{ env.provider_bpn }}"
          certificateType: "iso9001"
          locationBpns:
            - "${{ env.location_bpns }}"
    returns:
      status_code:
        type: integer
        class: StatusCode
    validate:
      - uses: validate/assert
        with: 
          input: status_code
          operator: equals
          value: 500
