## This code was partially generated using artificial intelligence (AI) (Tool: Copilot, Model: GPT-5.6).
## It was reviewed and tested by a human committer.

name: Build E2E Kind node cache

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: e2e-kind-node-cache
  cancel-in-progress: false

env:
  UMBRELLA_CHART_VERSION: "26.03.00"
  UMBRELLA_VALUES_REF: "umbrella-26.03.00"
  # The IdentityHub repository releases each chart under its own tag.
  IDENTITYHUB_CHART_VERSION: "v0.4.0"
  HELM_VERSION: "3.16.4"
  KIND_NODE_IMAGE: kindest/node:v1.31.0
  # Resolved after the checkout: `hashFiles` sees no files before it.
  KIND_NODE_CACHE_REPO: ghcr.io/${{ github.repository }}/e2e-kind-node
  UMBRELLA_CI_VALUES: tests/e2e/connector-dtr-smoke/ci/umbrella.values.yaml

jobs:
  build:
    if: github.repository == 'eclipse-tractusx/tractusx-testlab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Resolve the cached Kind node tag
        env:
          CACHE_TAG: ${{ hashFiles('tests/e2e/connector-dtr-smoke/ci/umbrella.values.yaml', '.github/workflows/build-kind-node-cache.yml', '.github/workflows/e2e-umbrella.yml') }}
        run: echo "KIND_NODE_CACHE_IMAGE=${KIND_NODE_CACHE_REPO}:${CACHE_TAG}" >> "${GITHUB_ENV}"

      - uses: azure/setup-helm@v4
        with:
          version: "${{ env.HELM_VERSION }}"

      - name: Render the pinned Umbrella release
        run: |
          set -euo pipefail
          helm repo add tractusx-dev https://eclipse-tractusx.github.io/charts/dev
          helm repo update
          helm pull tractusx-dev/umbrella --version "${UMBRELLA_CHART_VERSION}" \
            --untar --untardir "${RUNNER_TEMP}"
          chart_dir="${RUNNER_TEMP}/umbrella"
          source_bundles="${chart_dir}/charts/tx-data-provider/charts"
          nested_provider="${chart_dir}/charts/decentralized-identity-connector/charts/tx-data-provider"
          mkdir -p "${nested_provider}/charts"
          cp -R "${source_bundles}/." "${nested_provider}/charts/"

          # IdentityHub and IssuerService 0.4.0 — the EDC 0.16.0 -> 0.17.0
          # upgrade. Umbrella 26.03.00 pins both at chart v0.3.2 and a values
          # file cannot move a subchart version, so the released charts are
          # unpacked over the pinned ones and the dependency declarations that
          # name them are bumped to match. That bump is not cosmetic: helm
          # resolves an aliased dependency by name *and* version, and left at
          # v0.3.2 the second alias of decentralized-identity-connector
          # (edc-provider) renders no IdentityHub at all — no error, just a
          # missing participant.
          ih_release="https://github.com/eclipse-tractusx/tractusx-identityhub/releases/download"
          ih_charts="${RUNNER_TEMP}/identityhub-charts"
          mkdir -p "${ih_charts}"
          for chart in tractusx-identityhub-memory tractusx-issuerservice; do
            curl --fail --location --silent --show-error \
              "${ih_release}/${chart}-${IDENTITYHUB_CHART_VERSION}/${chart}-${IDENTITYHUB_CHART_VERSION}.tgz" \
              --output "${ih_charts}/${chart}.tgz"
            tar -xzf "${ih_charts}/${chart}.tgz" -C "${ih_charts}"
          done

          # The IdentityHub slot takes the *memory* chart, renamed to the
          # dependency's own name so umbrella's `tractusx-identityhub` values
          # keep addressing it. The rename is the whole substitution: the
          # memory chart's values are a strict subset of the SQL chart's --
          # the same `identityhub` block, minus `postgresql`, `vault` and
          # `waitForDependencies` -- so the profile still applies and the keys
          # it drops are exactly the ones an in-memory runtime has no use for.
          # It also brings no subcharts, so the participant Postgres the SQL
          # chart used to pull in is gone with it.
          identityhub_slot="${chart_dir}/charts/decentralized-identity-connector/charts/tractusx-identityhub"
          rm -rf "${identityhub_slot}" "${chart_dir}/charts/tractusx-issuerservice"
          cp -R "${ih_charts}/tractusx-identityhub-memory" "${identityhub_slot}"
          cp -R "${ih_charts}/tractusx-issuerservice" "${chart_dir}/charts/"
          python3 - "${chart_dir}" "${IDENTITYHUB_CHART_VERSION}" <<'PY'
          import pathlib
          import re
          import sys

          chart_dir, version = pathlib.Path(sys.argv[1]), sys.argv[2]
          slot = chart_dir / "charts/decentralized-identity-connector/charts/tractusx-identityhub"

          def substitute(path, pattern, replacement):
              text = path.read_text()
              patched, count = re.subn(pattern, replacement, text)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match for {pattern!r}, found {count}")
              path.write_text(patched)

          # The memory chart answers to the dependency's name from here on.
          substitute(
              slot / "Chart.yaml",
              r"(?m)^name: tractusx-identityhub-memory$",
              "name: tractusx-identityhub",
          )
          declarations = {
              chart_dir / "charts/decentralized-identity-connector/Chart.yaml": "tractusx-identityhub",
              chart_dir / "Chart.yaml": "tractusx-issuerservice",
          }
          for path, name in declarations.items():
              substitute(
                  path,
                  rf"(name: {name}\n  repository: [^\n]+\n  version: )\S+",
                  rf"\g<1>{version}",
              )
          PY

          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/eclipse-tractusx/tractus-x-umbrella/${UMBRELLA_VALUES_REF}/charts/umbrella/values-adopter-decentralized-identityhub.yaml" \
            --output "${RUNNER_TEMP}/umbrella-profile.yaml"
          helm template umbrella "${chart_dir}" \
            -f "${RUNNER_TEMP}/umbrella-profile.yaml" \
            -f "${UMBRELLA_CI_VALUES}" > "${RUNNER_TEMP}/umbrella-rendered.yaml"

      - name: Extract release images
        run: |
          python3 - "${RUNNER_TEMP}/umbrella-rendered.yaml" "${RUNNER_TEMP}/images.txt" <<'PY'
          import sys
          import yaml

          def find_images(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key == "image" and isinstance(child, str):
                          yield child
                      yield from find_images(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from find_images(child)

          with open(sys.argv[1], encoding="utf-8") as source:
              images = sorted({image for item in yaml.safe_load_all(source) for image in find_images(item)})
          if not images:
              raise SystemExit("No workload images found in the rendered Umbrella release.")
          with open(sys.argv[2], "w", encoding="utf-8") as output:
              output.write("\n".join(images) + "\n")
          print("\n".join(images))
          PY

      - name: Build Kind node with cached release images
        run: |
          set -euo pipefail
          docker pull "${KIND_NODE_IMAGE}"
          docker run --detach --privileged --name e2e-kind-node-cache "${KIND_NODE_IMAGE}" >/dev/null
          for _ in $(seq 1 30); do
            if docker exec e2e-kind-node-cache \
              crictl --runtime-endpoint unix:///run/containerd/containerd.sock images >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          while IFS= read -r image; do
            docker exec e2e-kind-node-cache \
              crictl --runtime-endpoint unix:///run/containerd/containerd.sock pull "${image}"
          done < "${RUNNER_TEMP}/images.txt"
          docker stop e2e-kind-node-cache
          docker commit \
            --change "LABEL org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --change "LABEL org.eclipse.tractusx.umbrella.chart=${UMBRELLA_CHART_VERSION}" \
            e2e-kind-node-cache "${KIND_NODE_CACHE_IMAGE}"

      - name: Publish cached Kind node
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${KIND_NODE_CACHE_IMAGE}"
