## This code was partially generated using artificial intelligence (AI) (Tool: Codex, Model: GPT-5.6 Sol).
## It was reviewed and tested by a human committer.

# E2E: testlab's compile -> validate -> run pipeline against a REAL,
# ephemeral Eclipse Tractus-X dataspace.
#
# No external cluster or secrets are needed: a `kind` (Kubernetes-in-Docker)
# cluster is created inside the runner itself and torn down at the end of the
# job, so the whole environment is "in-memory" for the run's lifetime.
#
# Deployed via Tractus-X Umbrella's "decentralized identityhub" profile
#   https://github.com/eclipse-tractusx/tractus-x-umbrella/blob/umbrella-26.03.00/charts/umbrella/values-adopter-decentralized-identityhub.yaml
# this gives:
#   - two EDC connectors ("provider" / BPNL000000000001, "consumer" /
#     BPNL000000000002), each fronted by its own Tractus-X IdentityHub for
#     DID/VC-based IATP trust
#   - one Digital Twin Registry, the provider's, shared by both participants:
#     the TCK binds `infrastructure.sut.dtr` to it and never addresses a
#     second, so ci/umbrella.values.yaml leaves the consumer's off along with
#     both `simple-data-backend`s, which nothing in the suite pulls from
#   - a BDRS directory service + an IssuerService
#
# testlab plays the "engine" role bound to the consumer connector; the
# provider connector + its DTR play the "sut" (system under test) role — see
# tests/e2e/connector-dtr-smoke/ for the TCK this workflow compiles,
# validates and runs, and tests/e2e/README.md for how to reproduce locally.
#
# Three things the chart does NOT do for you, and that this workflow therefore
# has to do itself — each one is fatal to the run if skipped:
#
#   1. **In-cluster DNS.** Every participant addresses its peers by ingress
#      hostname (`provider.local`, `consumer-dsp.local`, `issuerservice.local`,
#      …) — that is how did:web resolution, STS token exchange and the DSP
#      protocol are configured. Those names exist only in the runner's
#      /etc/hosts, which pods do not read, so CoreDNS is pointed at the ingress
#      controller for them.
#   2. **A default IngressClass.** The IdentityHub, data-plane and IssuerService
#      ingresses are rendered without a class (the profile leaves
#      `shared-configuration.ingress.className` empty), and ingress-nginx's kind
#      manifest does not mark its class as the cluster default — so those routes
#      would be served by nothing at all.
#   3. **Credential issuance.** The chart seeds the IssuerService's *claim rows*
#      but never turns them into VCs. Both participants must be walked through
#      the issuance flow or the TCK's Membership / DataExchangeGovernance
#      policies can never be satisfied. See ci/issue_credentials.py.
#
# Chart internals (ingress paths, subchart defaults) can drift between
# umbrella releases; where a value isn't pinned by the values file itself
# (the DTR's ingress host) this workflow discovers it at deploy time instead
# of hardcoding a guess, and fails fast with a clear message if it can't.

name: E2E - Umbrella Dataspace

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # nightly — this job is heavy (kind + a full Helm deploy)
  pull_request:
    branches: [main]
    paths:
      - "src/tractusx_testlab/steps/connector/**"
      - "src/tractusx_testlab/steps/industry/**"
      - "src/tractusx_testlab/services/**"
      - "src/tractusx_testlab/player/**"
      - "src/tractusx_testlab/compiler/**"
      - "src/tractusx_testlab/cli/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e-umbrella.yml"

env:
  UMBRELLA_NAMESPACE: umbrella
  UMBRELLA_CHART_VERSION: "26.03.00"
  UMBRELLA_VALUES_REF: "umbrella-26.03.00"
  KIND_VERSION: "v0.24.0"
  KUBECTL_VERSION: "v1.29.0"
  # 3.16+ for `--qps`: `--wait` polls every resource in the release, and with
  # ~125 of them the default client-side rate limit is what expires first.
  HELM_VERSION: "3.16.4"
  # Every JVM in the release boots at once on a 4-vCPU runner. A healthy
  # release settles in about three minutes, so this is a stall detector rather
  # than a budget — kept well clear of the measured time, but low enough that a
  # wedged deploy is reported in the same hour it started.
  HELM_TIMEOUT: "15m"
  TCK_INDEX: tests/e2e/connector-dtr-smoke/index.yaml
  TCK_CONFIG: tests/e2e/connector-dtr-smoke/ci/umbrella.vars.yaml
  UMBRELLA_CI_VALUES: tests/e2e/connector-dtr-smoke/ci/umbrella.values.yaml
  ISSUANCE_SCRIPT: tests/e2e/connector-dtr-smoke/ci/issue_credentials.py
  TCK_OUT: dist/testlab-e2e-connector-dtr-smoke.tck
  # Single source of truth for the dataspace hostnames, used for both the
  # runner's /etc/hosts and the cluster's CoreDNS. All of these are fixed by
  # values-adopter-decentralized-identityhub.yaml plus ci/umbrella.values.yaml.
  DATASPACE_HOSTS: >-
    provider.local
    provider.intranet
    provider-dsp.local
    provider-management.local
    provider-dtr.local
    consumer.local
    consumer.intranet
    consumer-dsp.local
    consumer-management.local
    bdrs-server.tx.test
    issuerservice.local

jobs:
  e2e-umbrella:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ------------------------------------------------------------------
      # 1. TestLab itself
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `pip install poetry` and `poetry install` download the same wheels on
      # every run of an unchanged lockfile. Same shape as tests.yml, plus
      # Poetry's own cache — that is the one `poetry install` reads.
      - name: Cache pip and Poetry downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry
          key: ${{ runner.os }}-e2e-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: ${{ runner.os }}-e2e-poetry-

      - name: Install Poetry
        run: pip install poetry

      - name: Install testlab
        run: poetry install --no-interaction

      # ------------------------------------------------------------------
      # 2. Ephemeral Kubernetes cluster (kind, in-runner — "in-memory")
      # ------------------------------------------------------------------
      - name: Reclaim runner disk space
        run: |
          # The release pulls ~15 container images into the kind node, and the
          # runner's preinstalled toolchains are worth more as free disk than
          # they are to this job: without this, kubelet hits disk pressure and
          # starts evicting pods mid-deploy.
          #
          # `rm -rf` over the Android SDK is minutes of small-file deletion,
          # and nothing between here and `kind create cluster` needs the space
          # — so it runs detached and is never waited on. The deploy is the
          # first step that cares, and by then it has long finished. A
          # `docker system prune` used to run here too; on a runner that has
          # pulled nothing yet it freed nothing.
          df -h /
          sudo nohup bash -c 'rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL' >/dev/null 2>&1 &
          echo "Reclaim started in the background."

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "${{ env.KUBECTL_VERSION }}"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "${{ env.HELM_VERSION }}"

      - name: Create kind cluster
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          cat <<'EOF' > kind-config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
              extraPortMappings:
                - containerPort: 80
                  hostPort: 80
                  protocol: TCP
                - containerPort: 443
                  hostPort: 443
                  protocol: TCP
          EOF
          ./kind create cluster --name tck-e2e --config kind-config.yaml --wait 5m

      - name: Install ingress-nginx and make it the default IngressClass
        run: |
          set -euo pipefail
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=300s

          # The IdentityHub, data-plane and IssuerService ingresses render with
          # no ingressClassName, and ingress-nginx's kind manifest does not
          # declare its class as the default — so nothing would claim them.
          kubectl patch ingressclass nginx \
            -p '{"metadata":{"annotations":{"ingressclass.kubernetes.io/is-default-class":"true"}}}'

      - name: Point dataspace hostnames at the runner
        run: |
          set -euo pipefail
          for host in ${DATASPACE_HOSTS}; do
            echo "127.0.0.1 ${host}"
          done | sudo tee -a /etc/hosts >/dev/null
          echo "Added to /etc/hosts:"
          printf '  %s\n' ${DATASPACE_HOSTS}

      - name: Point in-cluster DNS at the ingress controller
        run: |
          set -euo pipefail
          # Pods resolve their peers through CoreDNS, which knows nothing about
          # the ingress hostnames the participants are configured with. Without
          # this, did:web resolution, STS token exchange, the DSP handshake and
          # the credential-service callbacks all fail with UnknownHostException
          # while every pod still reports itself healthy.
          ingress_ip="$(kubectl -n ingress-nginx get svc ingress-nginx-controller \
            -o jsonpath='{.spec.clusterIP}')"
          if [ -z "${ingress_ip}" ]; then
            echo "::error::ingress-nginx-controller has no ClusterIP."
            exit 1
          fi
          echo "Resolving the dataspace hostnames to ${ingress_ip} inside the cluster."

          python3 - "${ingress_ip}" ${DATASPACE_HOSTS} <<'PY'
          import json
          import subprocess
          import sys

          ingress_ip, *hosts = sys.argv[1:]

          configmap = json.loads(
              subprocess.run(
                  ["kubectl", "-n", "kube-system", "get", "configmap", "coredns", "-o", "json"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
          )
          corefile = configmap["data"]["Corefile"]

          marker = "dataspace-hosts"
          if marker in corefile:
              print("CoreDNS already carries the dataspace hosts block.")
              raise SystemExit(0)

          block_lines = [f"    # {marker}", "    hosts {"]
          block_lines += [f"        {ingress_ip} {host}" for host in hosts]
          block_lines += ["        fallthrough", "    }", ""]
          block = "\n".join(block_lines)

          # CoreDNS fixes its plugin order at build time, so `hosts` is consulted
          # ahead of `forward` wherever it sits — but keep it above `forward`
          # anyway so the file reads the way it behaves.
          lines = corefile.splitlines()
          for index, line in enumerate(lines):
              if line.strip().startswith("forward "):
                  break
          else:
              raise SystemExit("::error::No 'forward' directive found in the CoreDNS Corefile.")

          patched = "\n".join([*lines[:index], block, *lines[index:]]) + "\n"
          subprocess.run(
              [
                  "kubectl", "-n", "kube-system", "patch", "configmap", "coredns",
                  "--type", "merge",
                  "-p", json.dumps({"data": {"Corefile": patched}}),
              ],
              check=True,
          )
          print(patched)
          PY

          kubectl -n kube-system rollout restart deployment/coredns
          kubectl -n kube-system rollout status deployment/coredns --timeout=120s

      # ------------------------------------------------------------------
      # 3. Deploy the dataspace: two EDCs, two IdentityHubs, DTRs, issuer
      # ------------------------------------------------------------------
      - name: Add Tractus-X Helm repo
        run: |
          helm repo add tractusx-dev https://eclipse-tractusx.github.io/charts/dev
          helm repo update

      - name: Generate the connectors' in-memory vault secrets
        run: |
          set -euo pipefail
          # `edc-runtime-memory` has no HashiCorp Vault client. Its vault is
          # in-process and seeded once, from `tx.edc.vault.secrets` — a
          # `alias:value;alias:value` string. Two things have to be in it:
          #
          #   * the EDR signing keypair. The data plane signs the token the
          #     consumer presents at the public API and verifies it when the
          #     token comes back, so both runtimes of one participant must
          #     hold the same pair. Umbrella's `post-install-vault-setup` hook
          #     still writes its own keypair into a HashiCorp vault nothing
          #     reads any more; this generates a fresh pair per run rather
          #     than committing a private key to this repository.
          #   * the STS client secret, under the alias the connector is
          #     configured with. Its value is the one the participant's
          #     IdentityHub seeds its own context with, and both come from the
          #     pinned profile rather than from anything generated here.
          secrets="${RUNNER_TEMP}/umbrella-vault-secrets.values.yaml"
          key="$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null)"
          pub="$(printf '%s\n' "${key}" | openssl pkey -pubout)"
          KEY="${key}" PUB="${pub}" poetry run python - "${secrets}" <<'PY'
          import os
          import sys

          import yaml


          def participant(alias: str, secret: str) -> dict:
              """One participant's two runtimes, seeded identically."""
              seed = ";".join(
                  (
                      f"tokenSignerPrivateKey:{os.environ['KEY']}",
                      f"tokenSignerPublicKey:{os.environ['PUB']}",
                      f"{alias}:{secret}",
                  )
              )
              runtime = {"env": {"TX_EDC_VAULT_SECRETS": seed}}
              return {
                  "tx-data-provider": {
                      "dataspace-connector-bundle": {
                          "tractusx-connector": {
                              "controlplane": dict(runtime),
                              "dataplane": dict(runtime),
                          }
                      }
                  }
              }


          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              yaml.safe_dump(
                  {
                      "edc-provider": participant("provider-secret", "provider"),
                      "edc-consumer": participant("consumer-secret", "consumer"),
                  },
                  handle,
              )
          PY
          echo "UMBRELLA_VAULT_SECRETS=${secrets}" >> "${GITHUB_ENV}"

      - name: Prepare and validate pinned Umbrella chart
        run: |
          set -euo pipefail
          chart_dir="${RUNNER_TEMP}/umbrella"
          helm pull tractusx-dev/umbrella \
            --version "${UMBRELLA_CHART_VERSION}" \
            --untar --untardir "${RUNNER_TEMP}"

          # Umbrella 26.03.00 packages the complete tx-data-provider bundles at
          # the root but omits them from decentralized-identity-connector's
          # nested tx-data-provider. Restore those same pinned dependencies.
          source_bundles="${chart_dir}/charts/tx-data-provider/charts"
          nested_provider="${chart_dir}/charts/decentralized-identity-connector/charts/tx-data-provider"
          test -d "${source_bundles}"
          test -d "${nested_provider}"
          mkdir -p "${nested_provider}/charts"
          cp -R "${source_bundles}/." "${nested_provider}/charts/"

          # The IdentityHub chart ships its own postgres dependency, gated on
          # `install.postgresql`. That condition is unreachable from values
          # here: umbrella includes decentralized-identity-connector twice
          # under two aliases, and the path resolves against the *participant*
          # level, where the profile sets `install.postgresql: true` for the
          # connector's own database. So the IdentityHub's copy comes up no
          # matter what a values file says — while every IdentityHub datasource
          # is pointed at the participant postgres by
          # `tractusx-identityhub.postgresql.jdbcUrl`, and nothing ever dials
          # it. Deleting the subchart is what actually removes it. The
          # datasource config is untouched: it reads `postgresql.auth.*`, which
          # this does not gate.
          rm -rf "${chart_dir}/charts/decentralized-identity-connector/charts/tractusx-identityhub/charts/postgres"

          profile_url="https://raw.githubusercontent.com/eclipse-tractusx/tractus-x-umbrella/${UMBRELLA_VALUES_REF}/charts/umbrella/values-adopter-decentralized-identityhub.yaml"
          rendered="${RUNNER_TEMP}/umbrella-rendered.yaml"
          helm template umbrella "${chart_dir}" \
            --namespace "${UMBRELLA_NAMESPACE}" \
            -f "${profile_url}" \
            -f "${UMBRELLA_CI_VALUES}" \
            -f "${UMBRELLA_VAULT_SECRETS}" \
            > "${rendered}"

          poetry run python - "${rendered}" <<'PY'
          import sys
          from collections import Counter

          import yaml

          expected_deployments = {
              "provider-dtr",
              "umbrella-consumer-connector-controlplane",
              "umbrella-consumer-connector-dataplane",
              "umbrella-consumer-identityhub",
              "umbrella-issuerservice",
              "umbrella-provider-connector-controlplane",
              "umbrella-provider-connector-dataplane",
              "umbrella-provider-identityhub",
          }
          # The vault-setup hooks are what put tokenSignerPrivateKey /
          # tokenSignerPublicKey / tokenEncryptionAesKey into each participant's
          # vault. They only render while the connector bundle owns the vault,
          # so a values change that moves the vault elsewhere silently leaves
          # every data-plane transfer unable to sign its EDR. Assert them.
          # `umbrella-issuer-custom-attestation-claims-seeding` is deliberately
          # not here: the in-memory IssuerService has no SQL store to seed, and
          # ci/umbrella.values.yaml switches that hook off. Its claims are
          # written onto the holder records by ci/issue_credentials.py instead.
          expected_hooks = {
              "umbrella-consumer-edc-post-install-vault-setup",
              "umbrella-provider-edc-post-install-vault-setup",
              "umbrella-post-install-bdrs-setup",
          }
          with open(sys.argv[1], encoding="utf-8") as stream:
              documents = [document for document in yaml.safe_load_all(stream) if document]

          def annotations(document):
              return document.get("metadata", {}).get("annotations") or {}

          deployments = {
              document["metadata"]["name"]
              for document in documents
              if document.get("kind") == "Deployment"
          }
          missing = sorted(expected_deployments - deployments)
          if missing:
              raise SystemExit(f"Umbrella manifest is missing deployments: {', '.join(missing)}")

          hooks = {
              document["metadata"]["name"]
              for document in documents
              if document.get("kind") == "Job" and "helm.sh/hook" in annotations(document)
          }
          missing_hooks = sorted(expected_hooks - hooks)
          if missing_hooks:
              raise SystemExit(
                  f"Umbrella manifest is missing install hooks: {', '.join(missing_hooks)}"
              )

          install_resources = [
              (
                  document.get("kind"),
                  document.get("metadata", {}).get("namespace", "umbrella"),
                  document.get("metadata", {}).get("name"),
              )
              for document in documents
              if document.get("kind")
              and document.get("metadata", {}).get("name")
              and "helm.sh/hook" not in annotations(document)
          ]
          duplicates = sorted(key for key, count in Counter(install_resources).items() if count > 1)
          if duplicates:
              raise SystemExit(f"Umbrella manifest has duplicate resources: {duplicates}")

          expected_routes = {
              "provider-dsp.local": {"/api/v1/dsp"},
              "provider-management.local": {"/management", "/control", "/catalog"},
              "consumer-dsp.local": {"/api/v1/dsp"},
              "consumer-management.local": {"/management", "/control", "/catalog"},
          }
          ingress_routes = {}
          for document in documents:
              if document.get("kind") != "Ingress":
                  continue
              for rule in document.get("spec", {}).get("rules", []):
                  ingress_routes.setdefault(rule.get("host"), set()).update(
                      path["path"] for path in rule.get("http", {}).get("paths", [])
                  )
          wrong_routes = {
              host: sorted(ingress_routes.get(host, set()))
              for host, paths in expected_routes.items()
              if ingress_routes.get(host) != paths
          }
          if wrong_routes:
              raise SystemExit(f"Umbrella manifest has incorrect connector routes: {wrong_routes}")
          prefixed_routes = sorted(
              (host, path)
              for host, paths in ingress_routes.items()
              for path in paths
              if path.startswith("/connector")
          )
          if prefixed_routes:
              raise SystemExit(f"Umbrella manifest still has /connector routes: {prefixed_routes}")

          print("Umbrella manifest contains both connectors, the shared DTR, the issuer,")
          print("the vault-setup hooks, and isolated connector routes.")
          print("Ingress hosts:", ", ".join(sorted(h for h in ingress_routes if h)))
          PY
          echo "UMBRELLA_CHART_DIR=${chart_dir}" >> "${GITHUB_ENV}"
          echo "UMBRELLA_PROFILE_URL=${profile_url}" >> "${GITHUB_ENV}"
          echo "UMBRELLA_RENDERED=${rendered}" >> "${GITHUB_ENV}"

      - name: Pre-load release images into the kind node
        continue-on-error: true
        run: |
          set -uo pipefail
          # Pulling ~25 images on demand inside a single-node cluster serialises
          # against the JVM startups it is competing with, and a Docker Hub
          # throttle shows up as an opaque readiness timeout 20 minutes later.
          # Doing it up front is best-effort: a miss here just means the kubelet
          # pulls it itself, but a failure is at least attributed correctly.
          images="$(grep -hoE '^[[:space:]]*-?[[:space:]]*image:[[:space:]]*"?[^"]+"?$' \
            "${UMBRELLA_RENDERED}" \
            | sed -E 's/.*image:[[:space:]]*//; s/"//g' | sort -u)"
          echo "${images}"
          for image in ${images}; do
            # A `tag@sha256:...` reference must never go through `kind load`.
            # `kind load` is `docker save` piped into containerd's importer, and
            # a save cannot carry the digest the reference names: containerd
            # therefore files the layers under a placeholder
            # (`docker.io/library/import-<date>@sha256:...`) whose digest is not
            # the one the pod asks for. The result is worse than a miss — the
            # kubelet pulls the real image fine, then CreateContainer resolves
            # the placeholder and fails "failed to get image from containerd …
            # not found", and re-pulling never repairs the record, so the pod is
            # stuck in CreateContainerError for the life of the cluster. That is
            # what held `umbrella-postgres-0` and
            # `umbrella-issuerservice-postgresql-0` down for a whole run: both
            # run `docker.io/postgres:18.0@sha256:…`, the release's only
            # digest-pinned image, and the IssuerService then CrashLoopBackOff'd
            # against the database that never came up.
            #
            # Pulling inside the node instead goes through the CRI, exactly as
            # the kubelet would, so the image is stored under the reference the
            # pod actually requests. The endpoint is passed explicitly because
            # the kind base image ships `crictl` but no `/etc/crictl.yaml`, and
            # a miss here is only a miss: the kubelet then pulls the image on
            # demand, which is the behaviour every non-preloaded image already
            # relies on.
            case "${image}" in
              *@sha256:*)
                docker exec tck-e2e-control-plane \
                  crictl --runtime-endpoint unix:///run/containerd/containerd.sock \
                  pull "${image}" >/dev/null 2>&1 \
                  && echo "loaded  ${image} (crictl — digest-pinned)" \
                  || echo "SKIPPED ${image} (digest-pinned; the kubelet will pull it)"
                continue
                ;;
            esac
            if docker pull --quiet "${image}" >/dev/null 2>&1; then
              ./kind load docker-image --name tck-e2e "${image}" >/dev/null 2>&1 \
                && echo "loaded  ${image}" \
                || echo "SKIPPED ${image} (kind load failed)"
            else
              echo "SKIPPED ${image} (pull failed)"
            fi
          done
          docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Deploy Tractus-X Umbrella (decentralized IdentityHub profile)
        run: |
          set -uo pipefail
          # `--wait` is load-bearing, not just convenience: Helm waits for
          # readiness *before* running post-install hooks, and the hooks seed
          # the vaults and the issuer's claim table against services that must
          # already be up.
          #
          # A bare 25-minute wait is opaque when it fails, so a watcher reports
          # what is still outstanding while Helm blocks.
          columns='NAME:.metadata.name'
          columns="${columns},PHASE:.status.phase"
          columns="${columns},RESTARTS:.status.containerStatuses[*].restartCount"
          columns="${columns},STATE:.status.containerStatuses[*].state.*.reason"
          columns="${columns},READY:.status.containerStatuses[*].ready"
          (
            tick=0
            while true; do
              sleep 30
              tick=$((tick + 1))
              echo "--- $(date -u +%H:%M:%S) waiting on the release ---"
              # Print only the pods that are not yet fully ready (READY is the
              # last column, one 'true'/'false' per container).
              outstanding="$(kubectl get pods -n "${UMBRELLA_NAMESPACE}" \
                -o "custom-columns=${columns}" 2>/dev/null \
                | awk 'NR == 1 || $NF !~ /^(true,)*true$/')"
              printf '%s\n' "${outstanding}"
              # Everything in this release is normally ready inside three
              # minutes. Past that a pod is stuck rather than starting, and
              # "what is outstanding" stops being enough — the probe's own
              # message is what separates the cases. A refused connection is a
              # runtime that never opened its port; a 503 is one that opened it
              # and reports itself unhealthy; a 404 is a probe aimed at a path
              # the runtime does not serve. Without this the only record of a
              # ten-minute stall is a pod name repeated twenty times.
              if [ "${tick}" -ge 6 ]; then
                printf '%s\n' "${outstanding}" | awk 'NR > 1 { print $1 }' \
                  | while IFS= read -r stuck; do
                      [ -n "${stuck}" ] || continue
                      kubectl get events -n "${UMBRELLA_NAMESPACE}" \
                        --field-selector "involvedObject.name=${stuck},type=Warning" \
                        -o "custom-columns=POD:.involvedObject.name,REASON:.reason,MESSAGE:.message" \
                        --no-headers 2>/dev/null | tail -2
                    done
              fi
            done
          ) &
          watcher=$!
          trap 'kill "${watcher}" 2>/dev/null || true' EXIT

          helm install umbrella "${UMBRELLA_CHART_DIR}" \
            --namespace "${UMBRELLA_NAMESPACE}" --create-namespace \
            -f "${UMBRELLA_PROFILE_URL}" \
            -f "${UMBRELLA_CI_VALUES}" \
            -f "${UMBRELLA_VAULT_SECRETS}" \
            --burst-limit 400 --qps 200 \
            --timeout "${HELM_TIMEOUT}" --wait
          status=$?

          kill "${watcher}" 2>/dev/null || true
          exit "${status}"

      - name: Deploy in-cluster echo backend
        run: |
          # Minimal HTTP backend the SUT's data plane proxies pulls to. Kept
          # cluster-internal (no ingress) — the EDC data plane reaches it
          # over the cluster network, nothing external is required.
          kubectl run tck-echo --image=traefik/whoami:v1.10 \
            --namespace "${UMBRELLA_NAMESPACE}" --port=80
          kubectl expose pod/tck-echo --namespace "${UMBRELLA_NAMESPACE}" \
            --port=80 --name=tck-echo
          kubectl wait --namespace "${UMBRELLA_NAMESPACE}" \
            --for=condition=ready pod/tck-echo --timeout=120s

      - name: Show dataspace pods
        run: |
          # `helm install --wait` above is the real readiness gate (it tracks
          # every resource in the release, not just these labels). This is
          # just a status dump for the log.
          kubectl get pods -n "${UMBRELLA_NAMESPACE}" -o wide
          kubectl get jobs -n "${UMBRELLA_NAMESPACE}" || true

      # ------------------------------------------------------------------
      # 4. Make the dataspace usable: issue the participants' credentials
      # ------------------------------------------------------------------
      - name: Issue Catena-X credentials to both participants
        run: |
          set -euo pipefail
          # The IssuerService mints a one-time super-user API key at startup and
          # only ever prints it to its own log.
          super_user_key=""
          for _ in $(seq 1 30); do
            super_user_key="$(kubectl logs -n "${UMBRELLA_NAMESPACE}" \
              deployment/umbrella-issuerservice --tail=-1 2>/dev/null \
              | sed -n 's/.*Please take note of the API Key: *\([^ ]*\).*/\1/p' \
              | tail -n 1)"
            if [ -n "${super_user_key}" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "${super_user_key}" ]; then
            echo "::error::Could not find the IssuerService super-user API key in its log."
            kubectl logs -n "${UMBRELLA_NAMESPACE}" deployment/umbrella-issuerservice --tail=200 || true
            exit 1
          fi
          echo "::add-mask::${super_user_key}"

          poetry run python "${ISSUANCE_SCRIPT}" \
            --issuer-url "http://issuerservice.local" \
            --super-user-key "${super_user_key}"

      # ------------------------------------------------------------------
      # 5. Discover what the chart didn't pin, then sanity-check reachability
      # ------------------------------------------------------------------
      - name: Discover DTR ingress host and base URL
        run: |
          set -euo pipefail
          DTR_HOST="$(kubectl get ingress provider-dtr \
            -n "${UMBRELLA_NAMESPACE}" \
            -o jsonpath='{.spec.rules[0].host}')"
          # The DTR's ingress serves the registry under a rewritten prefix
          # (`/semantics/registry(/|$)(.*)` -> `/$2`), so the API base URL is
          # the host *plus* that prefix — the bare host answers 404.
          DTR_PATH="$(kubectl get ingress provider-dtr \
            -n "${UMBRELLA_NAMESPACE}" \
            -o jsonpath='{.spec.rules[0].http.paths[0].path}')"
          if [ -z "${DTR_HOST}" ] || [ -z "${DTR_PATH}" ]; then
            echo "::error::Could not read the Digital Twin Registry ingress in namespace ${UMBRELLA_NAMESPACE}."
            kubectl get ingress -n "${UMBRELLA_NAMESPACE}"
            exit 1
          fi
          # Strip the regex tail, keeping the literal prefix.
          DTR_PREFIX="${DTR_PATH%%(*}"
          DTR_PREFIX="${DTR_PREFIX%/}"
          DTR_BASE_URL="http://${DTR_HOST}${DTR_PREFIX}"
          echo "Discovered DTR ingress: host=${DTR_HOST} path=${DTR_PATH}"
          echo "DTR base URL: ${DTR_BASE_URL}"
          echo "DTR_HOST=${DTR_HOST}" >> "$GITHUB_ENV"
          echo "DTR_BASE_URL=${DTR_BASE_URL}" >> "$GITHUB_ENV"

          # ci/umbrella.values.yaml pins this host, so it is already in
          # /etc/hosts — but add it if a chart bump ever changes it.
          grep -qE "[[:space:]]${DTR_HOST}\$" /etc/hosts \
            || echo "127.0.0.1 ${DTR_HOST}" | sudo tee -a /etc/hosts >/dev/null

      - name: Preflight — check connector and DTR reachability
        run: |
          set -euo pipefail
          query='{"@context":{"edc":"https://w3id.org/edc/v0.0.1/ns/"},"@type":"QuerySpec","offset":0,"limit":1}'
          for participant in provider consumer; do
            curl --fail-with-body --silent --show-error \
              --header "X-Api-Key: password" \
              --header "Content-Type: application/json" \
              --request POST --data "${query}" \
              "http://${participant}-management.local/management/v3/assets/request" \
              > /dev/null
            echo "${participant} management API: reachable"
          done
          # `--fail-with-body` earns its keep only if the body survives. It was
          # being redirected to /dev/null, which is why a 404 here said nothing
          # about whether nginx had matched no ingress rule or the registry
          # itself had answered — the two have very different causes.
          if ! dtr_body="$(curl --fail-with-body --location --silent --show-error \
            "${DTR_BASE_URL}/api/v3/shell-descriptors" 2>&1)"; then
            echo "::error::DTR API not reachable at ${DTR_BASE_URL}/api/v3/shell-descriptors"
            printf '%s\n' "${dtr_body}"
            exit 1
          fi
          echo "provider DTR API: reachable at ${DTR_BASE_URL}"

      # ------------------------------------------------------------------
      # 6. testlab: validate -> compile -> inspect -> run, against the live
      #    dataspace. One package, executed as several combinations: the
      #    manifest marks every test `skippable: true`, which is what lets an
      #    operator select a subset — and what this job uses to prove the
      #    selection machinery works against a real SUT rather than a mock.
      # ------------------------------------------------------------------
      - name: testlab validate
        run: poetry run testlab validate "${TCK_INDEX}"

      - name: testlab compile
        run: |
          mkdir -p dist
          poetry run testlab compile "${TCK_INDEX}" --output "${TCK_OUT}"

      # The package describes itself before anything runs it. This is also the
      # assertion that compilation kept the whole suite: a test dropped between
      # the manifest and the archive shows up here as a missing script.
      - name: testlab inspect — what the package says it will do
        run: |
          mkdir -p logs
          poetry run testlab inspect "${TCK_OUT}" --variables --infrastructure
          poetry run testlab inspect "${TCK_OUT}" --json > logs/inspect.json
          poetry run python - <<'PY'
          import json, pathlib, sys

          report = json.loads(pathlib.Path("logs/inspect.json").read_text())["inspection"]
          expected = {
              "connector_negotiation.yaml",
              "dsp_step_by_step.yaml",
              "dtr_roundtrip.yaml",
              "negative_paths.yaml",
          }
          found = {script["test_id"] for script in report["scripts"]}
          if found != expected:
              sys.exit(f"package carries {sorted(found)}, manifest declared {sorted(expected)}")
          print(f"package carries all {len(found)} tests, {report['total_steps']} steps, "
                f"{report['total_validations']} validations")
          PY

      # Combination 1 — the whole suite.
      - name: testlab run — full suite
        run: |
          poetry run testlab run "${TCK_OUT}" \
            --config "${TCK_CONFIG}" \
            --var "infrastructure.sut.dtr.base_url=${DTR_BASE_URL}" \
            --logs-dir logs/e2e/full

      # Combination 2 — the registry alone, from the same package. Nothing
      # recompiles; the selection is a run-time argument, and the engine
      # refuses ids that are unknown or that the manifest did not mark
      # skippable. This is also the proof that a test needing no connector
      # journey runs without one having happened first.
      #
      # One selection is enough to exercise that machinery, and this is the
      # cheap one: every other subset re-runs a DSP negotiation and a transfer
      # the full suite has already driven against the same live dataspace.
      - name: testlab run — registry combination
        run: |
          poetry run testlab run "${TCK_OUT}" \
            --config "${TCK_CONFIG}" \
            --var "infrastructure.sut.dtr.base_url=${DTR_BASE_URL}" \
            --var "skip_tests=connector_negotiation.yaml,dsp_step_by_step.yaml,negative_paths.yaml" \
            --logs-dir logs/e2e/registry

      # A selection the manifest does not permit must be refused, not silently
      # ignored — an operator who mistypes a test id has to find out.
      - name: testlab run — an unknown test id is refused
        run: |
          if poetry run testlab run "${TCK_OUT}" \
               --config "${TCK_CONFIG}" \
               --var "infrastructure.sut.dtr.base_url=${DTR_BASE_URL}" \
               --var "skip_tests=no-such-test.yaml" \
               --logs-dir logs/e2e/refused; then
            echo "::error::skipping an unknown test id was accepted; it must be refused"
            exit 1
          fi
          echo "unknown test id refused, as it must be"

      # ------------------------------------------------------------------
      # 7. Diagnostics + cleanup
      # ------------------------------------------------------------------
      # `failure()` alone is false for a cancelled job, so cancelling a run that
      # is stuck — the natural thing to do when the deploy is visibly wedged —
      # threw away the only record of why it was stuck. `cancelled()` keeps the
      # cluster's state, which is the whole reason this step exists.
      - name: Collect cluster diagnostics
        if: ${{ failure() || cancelled() }}
        run: |
          mkdir -p ci-logs
          helm status umbrella -n "${UMBRELLA_NAMESPACE}" > ci-logs/helm-status.txt 2>&1 || true
          kubectl get all -n "${UMBRELLA_NAMESPACE}" -o wide > ci-logs/resources.txt 2>&1 || true
          kubectl get nodes -o wide > ci-logs/nodes.txt 2>&1 || true
          kubectl describe nodes > ci-logs/nodes-describe.txt 2>&1 || true
          kubectl top nodes > ci-logs/nodes-top.txt 2>&1 || true
          kubectl get pods -n "${UMBRELLA_NAMESPACE}" -o wide > ci-logs/pods.txt 2>&1 || true
          kubectl describe pods -n "${UMBRELLA_NAMESPACE}" > ci-logs/pods-describe.txt 2>&1 || true
          kubectl get jobs -n "${UMBRELLA_NAMESPACE}" -o yaml > ci-logs/jobs.yaml 2>&1 || true
          kubectl get ingress -n "${UMBRELLA_NAMESPACE}" -o yaml > ci-logs/ingress.yaml 2>&1 || true
          kubectl get ingressclass -o yaml > ci-logs/ingressclass.yaml 2>&1 || true
          kubectl -n kube-system get configmap coredns -o yaml > ci-logs/coredns.yaml 2>&1 || true
          kubectl get events -n "${UMBRELLA_NAMESPACE}" --sort-by=.metadata.creationTimestamp \
            > ci-logs/events.txt 2>&1 || true
          df -h / > ci-logs/disk.txt 2>&1 || true
          while IFS= read -r pod; do
            pod_name="${pod#pod/}"
            kubectl logs -n "${UMBRELLA_NAMESPACE}" "${pod}" --all-containers --tail=1000 \
              > "ci-logs/${pod_name}.log" 2>&1 || true
            kubectl logs -n "${UMBRELLA_NAMESPACE}" "${pod}" --all-containers --previous --tail=1000 \
              > "ci-logs/${pod_name}-previous.log" 2>&1 || true
          done < <(kubectl get pods -n "${UMBRELLA_NAMESPACE}" -o name 2>/dev/null || true)

      - name: Upload testlab logs and execution traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testlab-e2e-run-${{ github.run_id }}
          path: logs
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload cluster diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: umbrella-diagnostics-${{ github.run_id }}
          path: ci-logs/
          retention-days: 14

      - name: Delete kind cluster
        if: always()
        run: ./kind delete cluster --name tck-e2e || true
