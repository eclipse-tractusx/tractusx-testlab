# The slim memory dataspace — what .github/workflows/e2e-dataspace.yml runs.
#
# One IdentityHub holds both participants. IdentityHub is multi-tenant: a
# participant context is a row, not a deployment, and each gets its own DID
# document, its own keypair and its own credential store inside the same
# runtime. `identityhub.local` therefore answers for both
# `did:web:identityhub.local:BPNL000000000001` and `...:BPNL000000000002`,
# because did:web resolves to `<host>/<participant-id>/did.json` and the hub's
# `did` endpoint is mounted at `/`.
#
# The hub's chart seeds exactly one context at boot — the provider's, below.
# ci/issue_credentials.py creates the consumer's over the Identity API and
# captures the STS client secret the hub generates for it; the workflow then
# installs the connectors with that secret in the consumer's vault. That
# ordering is the whole reason the dataspace is two Helm releases.
#
# Use hub-per-participant.values.yaml instead to give each participant its own
# hub — one pod more, one API call fewer, and the topology Umbrella's
# decentralized-identityhub profile deploys.

_ids:
  # Anchors only; Helm ignores a key no chart declares. They exist so the DIDs
  # and their base64 forms are written once and referenced, rather than being
  # eight independent chances to typo a participant id.
  provider_did: &provider_did "did:web:identityhub.local:BPNL000000000001"
  consumer_did: &consumer_did "did:web:identityhub.local:BPNL000000000002"
  issuer_did: &issuer_did "did:web:issuerservice.local:BPNL000000000003"
  trusted_issuers: &trusted_issuers
    - "did:web:issuerservice.local:BPNL000000000003"
  # base64 of the DID above. The IdentityHub's participant-scoped identity API
  # takes the context id in that form, and the x-api-key it accepts is prefixed
  # with it.
  provider_context: &provider_context "ZGlkOndlYjppZGVudGl0eWh1Yi5sb2NhbDpCUE5MMDAwMDAwMDAwMDAx"
  sts_token_url: &sts_token_url "http://identityhub.local/api/sts/token"

identityhub:
  fullnameOverride: identityhub
  identityhub:
    didweb:
      https: false
    livenessProbe:
      initialDelaySeconds: 120
    readinessProbe:
      initialDelaySeconds: 120
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    iatp:
      sts:
        oauth:
          client:
            # The one context the chart seeds at boot. `secret` is the STS
            # client secret, and it is a *chosen* value here — which is what
            # lets the provider connector be installed with it already in its
            # vault. The consumer's is generated by the hub instead.
            enabled: true
            id: *provider_did
            secret: "provider"
            secret_alias: "provider-sts-secret"
            x_api_key: "ZGlkOndlYjppZGVudGl0eWh1Yi5sb2NhbDpCUE5MMDAwMDAwMDAwMDAx.randomChars"
    ingresses:
      # One host, every endpoint. `did` is mounted at `/` and would swallow the
      # host on its own, but nginx matches the longest prefix, so
      # `/api/credentials`, `/api/sts` and `/api/identity` still win over it.
      - enabled: true
        hostname: identityhub.local
        className: nginx
        tls:
          enabled: false
        endpoints:
          - did
          - credentials
          - sts
          - identity
          - version
          - accounts

# A second hub is a dependency of the platform chart, gated off here.
consumer-identityhub:
  enabled: false

provider-connector:
  fullnameOverride: provider-connector
  participant:
    id: "BPNL000000000001"
    # Participant Context Id — required since tractusx-edc 0.12.0.
    contextId: "00000000-0000-0000-0000-000000000004"
  iatp:
    id: *provider_did
    trustedIssuers: *trusted_issuers
    sts:
      oauth:
        token_url: *sts_token_url
        client:
          id: *provider_did
          secret_alias: "provider-sts-secret"
  runtime:
    env:
      TX_EDC_IAM_IATP_CREDENTIALSERVICE_URL: "http://identityhub.local/api/credentials/v1/participants/ZGlkOndlYjppZGVudGl0eWh1Yi5sb2NhbDpCUE5MMDAwMDAwMDAwMDAx"
      EDC_IAM_DID_WEB_USE_HTTPS: "false"
      EDC_IAM_CREDENTIAL_REVOCATION_MIMETYPE: "application/json"
    ingresses:
      # Each API on its own hostname, so nothing else in the dataspace can
      # shadow it and the TCK's URLs stay unambiguous.
      - enabled: true
        hostname: provider-dsp.local
        className: nginx
        tls:
          enabled: false
        endpoints:
          - protocol
      - enabled: true
        hostname: provider-management.local
        className: nginx
        tls:
          enabled: false
        endpoints:
          - management
          - control
          - catalog
      - enabled: true
        hostname: provider-data.local
        className: nginx
        tls:
          enabled: false
        endpoints:
          - public
          - proxy

consumer-connector:
  fullnameOverride: consumer-connector
  participant:
    id: "BPNL000000000002"
    contextId: "00000000-0000-0000-0000-000000000005"
  iatp:
    id: *consumer_did
    trustedIssuers: *trusted_issuers
    sts:
      oauth:
        token_url: *sts_token_url
        client:
          id: *consumer_did
          # The hub generates this secret when ci/issue_credentials.py creates
          # the consumer's context. The workflow passes the value into
          # `vault.secrets` under this alias at install time.
          secret_alias: "consumer-sts-secret"
  runtime:
    env:
      TX_EDC_IAM_IATP_CREDENTIALSERVICE_URL: "http://identityhub.local/api/credentials/v1/participants/ZGlkOndlYjppZGVudGl0eWh1Yi5sb2NhbDpCUE5MMDAwMDAwMDAwMDAy"
      EDC_IAM_DID_WEB_USE_HTTPS: "false"
      EDC_IAM_CREDENTIAL_REVOCATION_MIMETYPE: "application/json"
    ingresses:
      - enabled: true
        hostname: consumer-dsp.local
        className: nginx
        tls:
          enabled: false
        endpoints:
          - protocol
      - enabled: true
        hostname: consumer-management.local
        className: nginx
        tls:
          enabled: false
        endpoints:
          - management
          - control
          - catalog
      - enabled: true
        hostname: consumer-data.local
        className: nginx
        tls:
          enabled: false
        endpoints:
          - public
          - proxy
