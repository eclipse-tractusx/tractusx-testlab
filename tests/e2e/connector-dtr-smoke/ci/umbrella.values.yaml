## This code was partially generated using artificial intelligence (AI) (Tool: Codex, Model: GPT-5.6 Sol).
## It was reviewed and tested by a human committer.

# CI-only additions to values-adopter-decentralized-identityhub.yaml.
# Umbrella 26.03.00 does not enable the participant Vaults and its packaged
# decentralized-identity-connector dependency omits these three bundles.
# The workflow restores the pinned bundles before applying these values.

edc-provider:
  install:
    vault: true
  tractusx-identityhub:
    identityhub:
      livenessProbe:
        initialDelaySeconds: 180
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
  tx-data-provider:
    controlplanePublicUrl: "http://provider-dsp.local"
    controlplaneManagementUrl: "http://provider-management.local"
    dataspace-connector-bundle:
      vault:
        enabled: false
      tractusx-connector:
        controlplane:
          endpoints:
            default:
              path: /api
            management:
              path: /management
            control:
              path: /control
            protocol:
              path: /api/v1/dsp
            catalog:
              path: /catalog
          ingresses:
            - enabled: true
              hostname: provider-dsp.local
              endpoints:
                - protocol
              className: nginx
              tls:
                enabled: false
            - enabled: true
              hostname: provider-management.local
              endpoints:
                - management
                - control
                - catalog
              className: nginx
              tls:
                enabled: false
    digital-twin-bundle:
      enabled: true
      digital-twin-registry:
        fullnameOverride: provider-dtr
        keycloak:
          fullnameOverride: provider-registry-keycloak
        registry:
          host: provider-dtr.local
          dataSource:
            url: jdbc:postgresql://provider-dtr-postgresql:5432/dtr
          ingress:
            rules:
              - host: provider-dtr.local
                http:
                  paths:
                    - path: "/semantics/registry(/|$)(.*)"
                      pathType: ImplementationSpecific
      postgresql:
        fullnameOverride: provider-dtr-postgresql
    data-persistence-layer-bundle:
      enabled: true
      simple-data-backend:
        fullnameOverride: provider-submodelserver
        ingress:
          hosts:
            - host: provider-submodelserver.local
              paths:
                - path: /
                  pathType: Prefix

