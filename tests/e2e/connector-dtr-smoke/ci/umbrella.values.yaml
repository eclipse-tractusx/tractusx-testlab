# Both of these ask for 500m of CPU by default. On a 4-vCPU runner that is
# ~a third of the schedulable capacity spent on two services that idle for
# most of the run, and it crowds out the connectors.
bdrs-server-memory:
  server:
    livenessProbe:
      initialDelaySeconds: 240
    resources:
      requests:
        cpu: 100m
        memory: 128Mi

tractusx-issuerservice:
  # Same for the issuer's database: the in-memory image holds its holders,
  # credential definitions and issuance processes in the process, and the one
  # thing that did write SQL here — the claim-seeding hook below — is off.
  install:
    postgresql: false
  # The claim rows this seeds go into a table only the SQL IssuerService
  # creates, and `psql -v ON_ERROR_STOP=1` makes the missing table a failed
  # post-install hook — which fails the whole `helm install --wait`. The
  # in-memory image reads claims off the holder record instead, and
  # ci/issue_credentials.py writes them there, so there is nothing left for
  # this hook to seed.
  attestationClaimSeeding:
    enabled: false
  issuerservice:
    # In-memory IssuerService. Its BOM is the base one, which ships the
    # `holder` attestation source and *not* the `database` one — the SQL BOM is
    # what carries that. ci/issue_credentials.py registers the holder
    # attestation and puts the claims on each holder record, so nothing reads
    # the `custom_attestation_claims` table Umbrella still seeds.
    image:
      repository: tractusx/issuerservice-memory
    livenessProbe:
      initialDelaySeconds: 240
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
