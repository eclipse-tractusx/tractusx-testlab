## This code was partially generated using artificial intelligence (AI) (Tool: Codex, Model: GPT-5.6 Sol).
## It was reviewed and tested by a human committer.

# CI-only additions to values-adopter-decentralized-identityhub.yaml.
#
# Three things this file is responsible for:
#
#   1. Giving the *consumer* participant a Digital Twin Registry and a data
#      backend (the upstream profile only gives them to the provider), so the
#      test environment has two of each.
#   2. Isolating each connector's DSP / management APIs onto their own ingress
#      hostnames, so nothing else on `<participant>.local` can shadow them.
#   3. Making the whole release survive on a 4-vCPU GitHub runner: every JVM in
#      the release boots at the same time on a heavily contended CPU, so the
#      stock 30s/100s liveness delays kill pods before they finish starting.
#
# Note what this file deliberately does NOT touch: the profile's vault wiring.
# `edc-provider.install.vault` stays `false` and the connector bundle's own
# vault stays enabled, because the bundle is what ships
# `post-install-vault-setup` — the hook that writes tokenSignerPrivateKey /
# tokenSignerPublicKey / tokenEncryptionAesKey into the participant's vault.
# Deploying the vault from `install.vault` instead gives you a vault with no
# secrets in it, and every data-plane transfer then fails to sign its EDR.
# The workflow's manifest validation asserts both hooks are present.

edc-provider:
  tractusx-identityhub:
    identityhub:
      livenessProbe:
        initialDelaySeconds: 240
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
  tx-data-provider:
    controlplanePublicUrl: "http://provider-dsp.local"
    controlplaneManagementUrl: "http://provider-management.local"
    dataspace-connector-bundle:
      vault:
        # The agent injector is not used here and costs a Deployment plus two
        # cluster-scoped MutatingWebhookConfigurations per participant.
        injector:
          enabled: false
      tractusx-connector:
        controlplane:
          livenessProbe:
            initialDelaySeconds: 240
          endpoints:
            default:
              path: /api
            management:
              path: /management
            control:
              path: /control
            protocol:
              path: /api/v1/dsp
            catalog:
              path: /catalog
          ingresses:
            - enabled: true
              hostname: provider-dsp.local
              endpoints:
                - protocol
              className: nginx
              tls:
                enabled: false
            - enabled: true
              hostname: provider-management.local
              endpoints:
                - management
                - control
                - catalog
              className: nginx
              tls:
                enabled: false
        dataplane:
          livenessProbe:
            initialDelaySeconds: 240
    digital-twin-bundle:
      enabled: true
      digital-twin-registry:
        fullnameOverride: provider-dtr
        keycloak:
          fullnameOverride: provider-registry-keycloak
        registry:
          host: provider-dtr.local
          livenessProbe:
            initialDelaySeconds: 240
          dataSource:
            url: jdbc:postgresql://provider-dtr-postgresql:5432/dtr
          ingress:
            rules:
              - host: provider-dtr.local
                http:
                  paths:
                    - path: "/semantics/registry(/|$)(.*)"
                      pathType: ImplementationSpecific
      postgresql:
        fullnameOverride: provider-dtr-postgresql
    data-persistence-layer-bundle:
      enabled: true
      simple-data-backend:
        fullnameOverride: provider-submodelserver
        livenessProbe:
          initialDelaySeconds: 240
        ingress:
          hosts:
            - host: provider-submodelserver.local
              paths:
                - path: /
                  pathType: Prefix

