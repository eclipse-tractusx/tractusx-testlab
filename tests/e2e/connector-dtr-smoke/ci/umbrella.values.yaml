  tractusx-identityhub:
    identityhub:
      livenessProbe:
        initialDelaySeconds: 240
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
  tx-data-provider:
    controlplanePublicUrl: "http://consumer-dsp.local"
    controlplaneManagementUrl: "http://consumer-management.local"
    dataspace-connector-bundle:
      vault:
        injector:
          enabled: false
      tractusx-connector:
        controlplane:
          livenessProbe:
            initialDelaySeconds: 240
          endpoints:
            default:
              path: /api
            management:
              path: /management
            control:
              path: /control
            protocol:
              path: /api/v1/dsp
            catalog:
              path: /catalog
          ingresses:
            - enabled: true
              hostname: consumer-dsp.local
              endpoints:
                - protocol
              className: nginx
              tls:
                enabled: false
            - enabled: true
              hostname: consumer-management.local
              endpoints:
                - management
                - control
                - catalog
              className: nginx
              tls:
                enabled: false
        dataplane:
          livenessProbe:
            initialDelaySeconds: 240
    digital-twin-bundle:
      enabled: true
      digital-twin-registry:
        fullnameOverride: consumer-dtr
        keycloak:
          fullnameOverride: consumer-registry-keycloak
        registry:
          host: consumer-dtr.local
          livenessProbe:
            initialDelaySeconds: 240
          dataSource:
            url: jdbc:postgresql://consumer-dtr-postgresql:5432/dtr
          ingress:
            rules:
              - host: consumer-dtr.local
