## This code was partially generated using artificial intelligence (AI) (Tool: Codex, Model: GPT-5.6 Sol).
## It was reviewed and tested by a human committer.

# CI-only additions to values-adopter-decentralized-identityhub.yaml.
#
# Three things this file is responsible for:
#
#   1. Cutting the release down to what the TCK actually addresses. The
#      dataspace needs two connectors, but only *one* Digital Twin Registry:
#      the suite binds `infrastructure.sut.dtr` to the provider's, and never
#      reaches for a second one — so the provider's registry is the shared
#      registry for both participants. Neither `simple-data-backend` is
#      addressed either: transfers pull from the workflow's own `tck-echo`
#      pod, and dtr_roundtrip.yaml's submodel endpoint is a DSP href rather
#      than a backend URL.
#   2. Isolating each connector's DSP / management APIs onto their own ingress
#      hostnames, so nothing else on `<participant>.local` can shadow them.
#   3. Making the whole release survive on a 4-vCPU GitHub runner: every JVM in
#      the release boots at the same time on a heavily contended CPU, so the
#      stock 30s/100s liveness delays kill pods before they finish starting.
#
# Note what this file deliberately does NOT touch: the profile's vault wiring.
# `edc-provider.install.vault` stays `false` and the connector bundle's own
# vault stays enabled, because the bundle is what ships
# `post-install-vault-setup` — the hook that writes tokenSignerPrivateKey /
# tokenSignerPublicKey / tokenEncryptionAesKey into the participant's vault.
# Deploying the vault from `install.vault` instead gives you a vault with no
# secrets in it, and every data-plane transfer then fails to sign its EDR.
# The workflow's manifest validation asserts both hooks are present.

edc-provider:
  # No Postgres for this participant. Nothing reads it any more: the
  # connector's stores are in the runtime's memory and the IdentityHub's
  # are in its own. The datasource config both charts still render points
  # at a Service that no longer exists, and neither image has the SQL
  # extensions that would dial it.
  install:
    postgresql: false
  tractusx-identityhub:
    identityhub:
      # In-memory IdentityHub. Same runtime, minus the SQL stores and the
      # HashiCorp vault client: the participant context, its keypair and the
      # credentials it is issued all live in the process. Nothing seeds it —
      # the context is created at boot from
      # `edc.tractusx.ih.participant.configurable.*`, which is where its STS
      # client secret comes from too — so the swap is the image alone. The
      # datasource config the chart still renders names stores this image does
      # not have, and is ignored rather than refused.
      image:
        repository: tractusx/identityhub-memory
      livenessProbe:
        initialDelaySeconds: 240
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
  tx-data-provider:
    controlplanePublicUrl: "http://provider-dsp.local"
    controlplaneManagementUrl: "http://provider-management.local"
    # Nothing in the suite pulls from a `simple-data-backend`: transfers
    # resolve to the workflow's own `tck-echo` pod, and dtr_roundtrip.yaml's
    # submodel endpoint is a DSP href. The profile already switches this bundle
    # off for the consumer and is silent about the provider, where it defaults
    # on — so say so.
    data-persistence-layer-bundle:
      enabled: false
    dataspace-connector-bundle:
      vault:
        # The agent injector is not used here and costs a Deployment plus two
        # cluster-scoped MutatingWebhookConfigurations per participant.
        injector:
          enabled: false
      tractusx-connector:
        controlplane:
          # The connector runs the single in-memory runtime instead of the
          # Postgres + HashiCorp-Vault control plane. `edc-runtime-memory`
          # bundles the control plane *and* the data plane, so this pod also
          # boots the data-plane half and wants the settings that half reads;
          # the block below is the set the upstream `tractusx-connector-memory`
          # chart renders and this one does not. The public endpoint it binds
          # is deliberately unexposed — the data-plane pod below is still the
          # one the ingress routes `/dataplane/api/public` to.
          image:
            repository: tractusx/edc-runtime-memory
          env:
            WEB_HTTP_PUBLIC_PORT: "8086"
            WEB_HTTP_PUBLIC_PATH: "/api/public"
            EDC_DATAPLANE_API_PUBLIC_BASEURL: "http://provider.local/dataplane/api/public"
            TX_EDC_DATAPLANE_TOKEN_REFRESH_ENDPOINT: "http://provider.local/dataplane/api/public/token"
            TX_EDC_DATAPLANE_TOKEN_EXPIRY: "300"
            TX_EDC_DATAPLANE_TOKEN_EXPIRY_TOLERANCE: "10"
            EDC_TRANSFER_PROXY_TOKEN_SIGNER_PRIVATEKEY_ALIAS: "tokenSignerPrivateKey"
            EDC_TRANSFER_PROXY_TOKEN_VERIFIER_PUBLICKEY_ALIAS: "tokenSignerPublicKey"
            TX_EDC_DPF_CONSUMER_PROXY_AUTH_APIKEY: "password"
          livenessProbe:
            initialDelaySeconds: 240
          endpoints:
            default:
              path: /api
            management:
              path: /management
            control:
              path: /control
            protocol:
              path: /api/v1/dsp
            catalog:
              path: /catalog
          ingresses:
            - enabled: true
              hostname: provider-dsp.local
              endpoints:
                - protocol
              className: nginx
              tls:
                enabled: false
            - enabled: true
              hostname: provider-management.local
              endpoints:
                - management
                - control
                - catalog
              className: nginx
              tls:
                enabled: false
        dataplane:
          # The same runtime in its data-plane role. The control-plane half it
          # also boots reads these; they are copied from the control-plane pod
          # of this participant, minus everything that would bind a port —
          # this pod's ports are the data plane's, and the management API it
          # would otherwise open on 8081 is where its public API already is.
          image:
            repository: tractusx/edc-runtime-memory
          env:
            TRACTUSX_EDC_PARTICIPANT_BPN: "BPNL000000000001"
            EDC_DSP_CALLBACK_ADDRESS: "http://provider-dsp.local/api/v1/dsp"
            EDC_OAUTH_PROVIDER_AUDIENCE: "idsc:IDS_CONNECTORS_ALL"
            EDC_OAUTH_ENDPOINT_AUDIENCE: "http://provider-dsp.local/api/v1/dsp"
            EDC_IAM_TRUSTED-ISSUER_0-ISSUER_ID: "did:web:issuerservice.local:BPNL000000000003"
            TX_EDC_IAM_IATP_BDRS_SERVER_URL: "http://bdrs-server.tx.test/api/directory"
            TX_EDC_IAM_IATP_BDRS_CACHE_VALIDITY: "600"
            TX_EDC_DCP_CACHE_ENABLED: "true"
            TX_EDC_DCP_CACHE_VALIDITY_SECONDS: "86400"
            EDC_POLICY_VALIDATION_ENABLED: "true"
            # Neither half of this pod should act as a connector in its own
            # right: no catalog crawling, and no DID registration racing the
            # control plane's.
            EDC_CATALOG_CACHE_EXECUTION_ENABLED: "false"
            TX_EDC_DID_SERVICE_SELF_REGISTRATION_ENABLED: "false"
            TX_EDC_DID_SERVICE_SELF_DEREGISTRATION_ENABLED: "false"
          livenessProbe:
            initialDelaySeconds: 240
    digital-twin-bundle:
      enabled: true
      digital-twin-registry:
        fullnameOverride: provider-dtr
        keycloak:
          fullnameOverride: provider-registry-keycloak
        registry:
          host: provider-dtr.local
          livenessProbe:
            initialDelaySeconds: 240
          dataSource:
            url: jdbc:postgresql://provider-dtr-postgresql:5432/dtr
          ingress:
            # The registry is the only component in this release whose ingress
            # carries a `tls:` section, pointing at a chart-generated self-signed
            # certificate. ingress-nginx answers plain HTTP on a TLS-bearing host
            # with a 308 to HTTPS, and that certificate then fails verification —
            # `curl: (60) SSL certificate problem: self-signed certificate` in the
            # preflight, and the same failure inside the four `testlab run`
            # invocations, which all address the DTR over `http://`.
            #
            # Turning the redirect off is what makes the DTR behave like every
            # other ingress here — plain HTTP, on hostnames that only resolve
            # inside this job, in a cluster that lives for one run. The
            # alternative, `registry.ingress.tls.enabled: false`, looks tidier
            # and is a trap: in digital-twin-registry 0.11.0 that branch of
            # registry-ingress.yaml emits a stray `[]` under `spec:`, which YAML
            # folds into the line above it, and the ingress comes out with
            # `ingressClassName: "nginx []"` — silently claimed by no controller
            # at all.
            annotations:
              nginx.ingress.kubernetes.io/ssl-redirect: "false"
            rules:
              - host: provider-dtr.local
                http:
                  paths:
                    - path: "/semantics/registry(/|$)(.*)"
                      pathType: ImplementationSpecific
      postgresql:
        fullnameOverride: provider-dtr-postgresql

