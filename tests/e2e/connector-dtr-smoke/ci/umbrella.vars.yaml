## It was reviewed and tested by a human committer.

# Consumed by `.github/workflows/e2e-umbrella.yml` via `testlab run --config`.
#
# These are the values fixed by charts/umbrella/values-adopter-decentralized-
# identityhub.yaml and the tractusx-connector chart's own defaults (pinned by
# the workflow's `helm install`), so they are safe to commit here. The one
# value the chart does not pin — the SUT DTR base URL — is discovered by the
# workflow at deploy time and injected on the CLI with `--var`, which
# overrides whatever is (or is not) set here.
#
# Source of truth for these values:
#   https://github.com/eclipse-tractusx/tractus-x-umbrella/blob/main/charts/umbrella/values-adopter-decentralized-identityhub.yaml
#   https://github.com/eclipse-tractusx/tractusx-edc/blob/main/charts/tractusx-connector/values.yaml

variables:
  # engine = umbrella's "consumer" participant — the connector testlab drives.
  #
  # Connector APIs use dedicated ingress hosts and their native paths. This
  # prevents another component on consumer.local from handling the request.
  infrastructure.engine.connector.management_url: "http://consumer-management.local/management"
  infrastructure.engine.connector.api_key: "password"
  # Operator-supplied, exactly like the SUT's: a connector the engine drives
  # still has to say which participant it is, because that is the identity the
  # counter-party sees on a negotiation. A Saturn connector speaking DSP 2025-1
  # identifies itself by its DID — the chart wires `iatp.id` into
  # `EDC_PARTICIPANT_ID`, and the BPN lives in a separate
  # `TRACTUSX_EDC_PARTICIPANT_BPN` that only the v0.8 protocol still answers
  # with. The BPN-addressed steps (`query_catalog_by_bpnl`, `do_dsp_with_bpnl`)
  # are the ones that take a BPN, and they resolve it to this DID themselves.
  infrastructure.engine.connector.participant_id: "did:web:consumer.local:identityhub:BPNL000000000002"

  # sut = umbrella's "provider" participant — the connector + DTR under test.
  infrastructure.sut.connector.management_url: "http://provider-management.local/management"
  infrastructure.sut.connector.api_key: "password"
  # The DID, for the same reason as the engine's: it is what the provider puts
  # in the catalog's `participantId` and in the agreement's `assigner`, so a
  # negotiation addressed to the BPN stores an identity the provider never
  # presents, and the consumer then rejects the provider's own agreement.
  infrastructure.sut.connector.participant_id: "did:web:provider.local:identityhub:BPNL000000000001"
  # The DSP *version* path, not the protocol root. EDC sends a protocol
  # message to the counter-party address exactly as given — nothing appends
  # the negotiated version to it — and a Saturn connector speaks
  # `dataspace-protocol-http:2025-1`, which is served under `/2025-1`. Pointing
  # at the root delivers a 2025-1 message to the v0.8 handler, and the
  # provider answers `dspace:CatalogError` "Bad request".
  infrastructure.sut.connector.dsp_url: "http://provider-dsp.local/api/v1/dsp/2025-1"

  # The engine's own registry and the payload store behind it. The registry is
  # the provider's: this release deploys one Digital Twin Registry and both
  # participants share it, and binding the engine to it changes nothing at
  # runtime because a bare registry lookup resolves to the SUT's binding first.
  # Its address is discovered per run like the SUT's, so only the submodel
  # server is pinned here — it is deployed by the workflow, at a hostname the
  # workflow chooses, and industry_core_journey.yaml uploads its payload there.
  infrastructure.engine.dtr.submodel_base_url: "http://tck-submodel.local"

  # The two participants' business partner numbers. They are not bindings and
  # cannot be: a Saturn connector identifies itself by DID, which is what the
  # `participant_id` keys above carry, while the BPN is what a *caller* holds —
  # the receiver field of a Catena-X notification, and the input BPN-addressed
  # discovery resolves against the dataspace's BPN-DID directory. Both are
  # fixed by values-adopter-decentralized-identityhub.yaml and by the BDRS
  # seeding in it, so unlike the addresses they can be committed.
  sut_bpnl: "BPNL000000000001"
  engine_bpnl: "BPNL000000000002"

  # mock_server_external_url — intentionally absent; supplied via
  # `--var mock_server_external_url=http://<gateway>:8100` once the workflow
  # has read the kind node's gateway. It is the root of testlab's own mock
  # server as a pod can reach it, which no chart value pins and no deployment
  # shares, so it is discovered per run rather than committed here.

  # stub_caller_url — intentionally absent; supplied via
  # `--var stub_caller_url=http://tck-stub.local` once the workflow has
  # deployed ci/stub_caller.py behind that ingress host. It is not part of the
  # umbrella release, so nothing here can vouch for it.

  # dtr_internal_url and infrastructure.engine.dtr.base_url — intentionally
  # absent; supplied via `--var` once the workflow has resolved the registry.
  # The first is the registry's API root as the *provider's data plane* can
  # reach it, which is a cluster Service address on a port this profile does
  # not pin, and the second is the same registry over its ingress. Both are
  # derived from the live deployment for the same reason the SUT's is.

  # infrastructure.sut.dtr.base_url — intentionally absent; supplied via
  # `--var infrastructure.sut.dtr.base_url=...` once the workflow has resolved
  # the DTR's ingress host *and* its rewritten path prefix for this chart
  # version. The registry is served under `/semantics/registry`, so the base URL
  # is host + prefix (`http://provider-dtr.local/semantics/registry`) — the bare
  # host answers 404. Both halves are subchart defaults rather than values this
  # profile pins, which is why they are discovered instead of committed here.
