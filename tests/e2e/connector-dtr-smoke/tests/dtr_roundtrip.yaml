## This code was partially generated using artificial intelligence (AI) (Tool: Codex, Model: GPT-5.6 Sol).
## It was reviewed and tested by a human committer.

kind: test
syntax: v1-alpha

namespace: testlab-e2e-connector-dtr-smoke
id: dtr-roundtrip

metadata:
  name: "DTR Round-trip"
  version: "v1.0.0"
  description: >
    Writes a shell descriptor with one submodel descriptor to the SUT's real
    Digital Twin Registry, reads it back, and confirms both documents match —
    proving testlab's DTR steps work end-to-end against a live registry.

execution:
  - id: new_twin_id
    uses: util/generate_uuid
    name: Mint a twin ID unique to this run
    returns:
      value:
        type: string

  - id: create_shell
    uses: digital-twin/provider/create_shell_descriptor
    name: Register the shell descriptor on the SUT's DTR
    with:
      shell_descriptor:
        id: "urn:uuid:${{ execution.new_twin_id.value }}"
        idShort: "testlabE2eSmokeTwin"
        specificAssetIds:
          - name: "manufacturerPartId"
            value: "testlab-e2e-smoke-part"
            externalSubjectId:
              type: ExternalReference
              keys:
                - type: GlobalReference
                  value: "${{ infrastructure.sut.connector.participant_id }}"
        submodelDescriptors:
          - id: "urn:uuid:submodel-testlab-e2e-smoke"
            idShort: "smokeSubmodel"
            semanticId:
              type: ExternalReference
              keys:
                - type: GlobalReference
                  value: "urn:samm:io.testlab:1.0.0#SmokeSubmodel"
            endpoints:
              - interface: "SUBMODEL-3.0"
                protocolInformation:
                  href: "${{ infrastructure.sut.connector.dsp_url }}"
                  endpointProtocol: "HTTP"
                  endpointProtocolVersion: ["1.1"]
                  subprotocol: "DSP"
                  # This script exercises the DTR API surface in isolation from
                  # connector_negotiation.yaml, so the referenced asset id is a
                  # placeholder rather than a real EDC asset — it does not need
                  # to resolve for create/get/delete to round-trip correctly.
                  subprotocolBody: "id=testlab-e2e-smoke-asset;dspEndpoint=${{ infrastructure.sut.connector.dsp_url }}"
                  subprotocolBodyEncoding: "plain"
                  # The AAS spec makes this optional; the Tractus-X registry
                  # does not — it dereferences the set while storing the
                  # endpoint and answers 500 when it is absent. Saying "no
                  # security attributes" explicitly is what an omitted list
                  # was meant to say.
                  securityAttributes:
                    - type: "NONE"
                      key: "NONE"
                      value: "NONE"
    returns:
      id:
        type: string
    validate:
      - uses: validate/assert
        with: { input: id, operator: equals, value: "urn:uuid:${{ execution.new_twin_id.value }}" }

  - id: read_back_shell
    uses: digital-twin/provider/get_shell_descriptor
    name: Read the shell descriptor back from the SUT's DTR
    with:
      aas_identifier: "urn:uuid:${{ execution.new_twin_id.value }}"
    returns:
      id:
        type: string
      id_short:
        type: string
    validate:
      - uses: validate/assert
        with: { input: id, operator: equals, value: "urn:uuid:${{ execution.new_twin_id.value }}" }
      - uses: validate/assert
        with: { input: id_short, operator: equals, value: "testlabE2eSmokeTwin" }

teardown:
  - id: delete_shell
    uses: digital-twin/provider/delete_shell_descriptor
    name: Delete the shell descriptor
    with:
      aas_identifier: "urn:uuid:${{ execution.new_twin_id.value }}"
    returns:
      status_code:
        type: integer
    validate:
      # This run created the twin, so a delete answered with anything but 204
      # means the round-trip did not end where it started.
      - uses: validate/assert
        with: { input: status_code, operator: equals, value: 204 }
