## This code was partially generated using artificial intelligence (AI) (Tool: Claude Code, Model: Claude Opus 5.5).
## It was reviewed and tested by a human committer.

kind: test
syntax: v1-alpha

namespace: testlab-e2e-connector-dtr-smoke
id: api-files

metadata:
  name: "API Files"
  version: "v1.0.0"
  description: >
    The two API files the manifest carries under env.apis (ADR-0030), read at
    run time and held against the services they describe. The Digital Twin
    Registry's own OpenAPI document names the service profile it implements;
    the registry the umbrella deployed must announce exactly that profile on
    its self-description. The mock's document names the header its API key
    goes in; security/api_key places the key there and the keyed mock lets
    the call through. Each step reads one value out of a document, and the
    run records the document by its summary, never whole — the workflow
    checks that on the trace.

setup:
  - id: echo
    uses: mock/api
    name: Open the endpoint the mock's API file describes
    with:
      method: GET
      path: "/testlab-e2e/api-files/echo"
      response_status: 200
      response_body:
        ok: true
        served_by: testlab-mock
    returns:
      api_key:
        type: string
      full_mock_url:
        type: string

execution:
  # A. The registry's document against the registry.

  - id: dtr_profile
    uses: util/json_path_extract
    name: Read the service profile the registry's API file declares
    with:
      input: "${{ env.apis.dtr }}"
      path: info.x-profile-identifier
    returns:
      value:
        type: string
    validate:
      - uses: validate/assert
        with:
          input: value
          operator: equals
          value: "https://admin-shell.io/aas/API/3/1/AssetAdministrationShellRegistryServiceSpecification/SSP-001"

  # GET /description is the document's GetSelfDescription operation, at the
  # document's server path /api/v3. The registry runs with authentication off
  # in this deployment, so no credential is needed.
  - id: dtr_description
    uses: http/http_request
    name: Ask the deployed registry which profiles it implements
    with:
      url: "${{ infrastructure.sut.dtr.base_url }}/api/v3/description"
      method: GET
    validate:
      - uses: validate/assert
        with: { input: status_code, operator: equals, value: 200 }
      - uses: validate/field
        with:
          input: value
          path: profiles
          operator: contains
          value: "${{ execution.dtr_profile.value }}"

  # B. The mock's document drives the call to the mock.

  - id: mock_key_header
    uses: util/json_path_extract
    name: Read the header the mock's API file puts the key in
    with:
      input: "${{ env.apis.testlab_mock }}"
      path: components.securitySchemes.mockKey.name
    returns:
      value:
        type: string
    validate:
      - uses: validate/assert
        with: { input: value, operator: equals, value: x-api-key }

  - id: mock_key
    uses: security/api_key
    name: Place the run's key where the document says
    with:
      key: "${{ setup.echo.api_key }}"
      name: "${{ execution.mock_key_header.value }}"
    returns:
      headers:
        type: object

  - id: call_echo
    uses: http/http_request
    name: Call the documented endpoint with the key the document asked for
    with:
      url: "${{ setup.echo.full_mock_url }}"
      method: GET
      headers: "${{ execution.mock_key.headers }}"
    validate:
      - uses: validate/assert
        with: { input: status_code, operator: equals, value: 200 }
      - uses: validate/field
        with: { input: value, path: served_by, operator: equals, value: testlab-mock }
