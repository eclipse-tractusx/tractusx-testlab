## It was reviewed and tested by a human committer.

kind: test
syntax: v1-alpha

namespace: testlab-e2e-connector-dtr-smoke
id: offer-guard

metadata:
  name: "Offer guard"
  version: "v1.0.0"
  description: >
    A negotiating step with no filter would negotiate whichever offer the
    SUT's catalog lists first. The run must refuse it before the catalog is
    even asked for (OFFER_FILTER_MISSING). This test is *meant* to fail: the
    workflow runs it on its own, requires the run to fail, and reads the
    refusal's code back from the trace. The full suite skips it.

execution:
  - id: unfiltered_pull
    uses: connector/consumer/pull_data_filtered
    name: Ask for a negotiation without saying which offer
    expects: fail
    with:
      counter_party_address: "${{ infrastructure.sut.connector.dsp_url }}"
      counter_party_id: "${{ infrastructure.sut.connector.participant_id }}"
      expected_policies: "${{ env.usage_policy }}"
