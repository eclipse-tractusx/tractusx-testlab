kind: test
syntax: v1-alpha

namespace: testlab-e2e-connector-dtr-smoke
id: connector-negotiation

metadata:
  name: "Connector Negotiation"
  version: "v1.0.0"
  description: >
    Drives the engine connector (umbrella's "consumer" EDC) through a real
    DSP catalog request, contract negotiation, transfer and data pull
    against the SUT connector (umbrella's "provider" EDC) — proving the two
    live connectors can actually talk to each other. The SUT's asset and
    policies are provisioned by the workflow before this run, not by
    testlab (see index.yaml's header comment for why).

execution:
  - id: pull_data
    uses: connector/consumer/pull_data_filtered
    name: Run the full DSP flow against the SUT's pre-provisioned asset
    with:
      counter_party_address: "${{ infrastructure.sut.connector.dsp_url }}"
      counter_party_id: "${{ infrastructure.sut.connector.participant_id }}"
      filters:
        - operand_left: "https://w3id.org/edc/v0.0.1/ns/id"
          operator: "="
          operand_right: "testlab-e2e-smoke-asset"
      policy: "${{ env.usage_policy.policy }}"
    returns:
      asset_id:
        type: string
      negotiation_id:
        type: string
      dataplane_url:
        type: string
      edr_token:
        type: string
    validate:
      - uses: validate/assert
        with: { input: asset_id, operator: equals, expected: "testlab-e2e-smoke-asset" }
      - uses: validate/assert
        with: { input: negotiation_id, operator: not_null }
      - uses: validate/assert
        with: { input: dataplane_url, operator: not_null }
      - uses: validate/assert
        with: { input: edr_token, operator: not_null }

  - id: fetch_data
    uses: connector/dataplane/http_request
    name: Fetch the actual payload through the negotiated data plane
    validate:
      - uses: validate/assert
        with: { input: fetch_data, operator: not_null }
