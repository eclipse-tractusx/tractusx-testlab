## This code was partially generated using artificial intelligence (AI) (Tool: Claude Code, Model: Claude Opus 5).
## It was reviewed and tested by a human committer.

kind: test
syntax: v1-alpha

namespace: testlab-e2e-connector-dtr-smoke
id: catalog-variants

metadata:
  name: "Catalog and DSP variants"
  version: "v1.0.0"
  description: >
    connector_negotiation.yaml drives the DSP flow one way and
    dsp_step_by_step.yaml drives it the other, and between them they leave
    most of the consumer catalogue untouched: the unfiltered catalog query,
    the query that filters by asset id, the one-shot `do_dsp`, and the pull
    that will only accept an offer made under a policy the script names. Each
    of those is a different code path into the same live provider, and a
    script picks between them, so each is exercised here against offers this
    test provisions itself. The provider side is provisioned twice over as
    well — once from a whole asset and policy document, once field by field
    through the wizard steps — because the two forms are meant to register
    the same thing and only a live connector can say whether they do.

setup:
  - id: create_access_policy
    uses: connector/provider/create_policy
    name: Create the SUT catalog access policy
    with:
      policy: "${{ env.access_policy }}"
    returns:
      policy_id:
        type: string

  - id: create_usage_policy
    uses: connector/provider/create_policy
    name: Create the SUT contract usage policy
    with:
      policy: "${{ env.usage_policy }}"
    returns:
      policy_id:
        type: string

  # The access policy written field by field instead of as a document. It is
  # an access rule rather than a usage one on purpose: the wizard form takes
  # permissions and nothing else, and the Catena-X profile holds a `use`
  # permission to FrameworkAgreement and UsagePurpose constraints, so a usage
  # policy assembled this way would be refused for what it says rather than
  # for how it was written — which is not what this step is here to find out.
  - id: create_wizard_policy
    uses: connector/provider/wizard/create_policy
    name: Create a second access policy, field by field
    with:
      policy_id: testlab-e2e-wizard-policy
      permissions:
        - action: access
          constraints:
            - left_operand: Membership
              operator: eq
              right_operand: active
    returns:
      policy_id:
        type: string

  - id: create_asset
    uses: connector/provider/create_asset
    name: Create the asset the catalog queries look for
    with:
      asset:
        asset_id: testlab-e2e-catalog-asset
        base_url: "http://tck-echo.umbrella.svc.cluster.local"
        dct_type: "https://w3id.org/catenax/taxonomy#TestData"
        version: "1.0"
    returns:
      asset_id:
        type: string

  # The same registration, described rather than handed over. The wizard step
  # assembles the document and posts it through the same call, so an asset
  # that appears in the catalog under the id derived here is the evidence that
  # the two forms have not drifted apart.
  - id: create_wizard_asset
    uses: connector/provider/wizard/create_asset
    name: Create a second asset, field by field
    with:
      asset_id: testlab-e2e-wizard-asset
      name: TestLab E2E wizard asset
      description: Registered through the guided form rather than as a document
      base_url: "http://tck-echo.umbrella.svc.cluster.local"
      content_type: application/json
      properties:
        "dct:type": "https://w3id.org/catenax/taxonomy#TestData"
        "cx-common:version": "1.0"
    returns:
      asset_id:
        type: string

  - id: create_contract
    uses: connector/provider/create_contract_definition
    name: Publish the document-form asset
    with:
      contract_definition_id: testlab-e2e-catalog-contract
      access_policy_id: "${{ setup.create_access_policy.policy_id }}"
      contract_policy_id: "${{ setup.create_usage_policy.policy_id }}"
      asset_id: "${{ setup.create_asset.asset_id }}"
    returns:
      contract_definition_id:
        type: string

  - id: create_wizard_contract
    uses: connector/provider/create_contract_definition
    name: Publish the wizard-form asset under the wizard access policy
    with:
      contract_definition_id: testlab-e2e-wizard-contract
      access_policy_id: "${{ setup.create_wizard_policy.policy_id }}"
      contract_policy_id: "${{ setup.create_usage_policy.policy_id }}"
      asset_id: "${{ setup.create_wizard_asset.asset_id }}"
    returns:
      contract_definition_id:
        type: string

execution:
  # No filter at all. Every other catalog step in the suite narrows the
  # request, so this is the only one that asks the provider what it offers
  # altogether — and the only one that would notice a connector answering a
  # filtered request correctly and an unfiltered one not at all.
  - id: whole_catalog
    uses: connector/consumer/query_catalog
    name: Ask the SUT for its whole catalog
    with:
      counter_party_address: "${{ infrastructure.sut.connector.dsp_url }}"
      counter_party_id: "${{ infrastructure.sut.connector.participant_id }}"
    returns:
      catalog:
        type: object
      datasets:
        type: array
    validate:
      - uses: validate/assert
        with: { input: catalog, operator: not_null }
      # Setup published two offers, so an answer carrying fewer than two is
      # either a catalog that dropped one or a provisioning step that reported
      # a success it did not have.
      - uses: validate/assert
        with: { input: datasets, operator: length_gt, value: 1 }

  # The same catalog, narrowed to one asset by the connector rather than by
  # the script. What it publishes is the offer itself — the asset id and the
  # policy it is offered under — which is what a negotiation has to be given.
  - id: catalog_by_asset
    uses: connector/consumer/query_catalog_by_asset_id
    name: Query the catalog for one asset by its id
    with:
      counter_party_address: "${{ infrastructure.sut.connector.dsp_url }}"
      counter_party_id: "${{ infrastructure.sut.connector.participant_id }}"
      asset_id: "${{ setup.create_asset.asset_id }}"
    returns:
      datasets:
        type: array
      catalog_asset_id:
        type: string
      catalog_policy:
        type: object
    validate:
      - uses: validate/assert
        with: { input: datasets, operator: length_equals, value: 1 }
      - uses: validate/assert
        with: { input: catalog_asset_id, operator: equals, value: testlab-e2e-catalog-asset }
      - uses: validate/assert
        with: { input: catalog_policy, operator: not_null }

  # The offer document, reached by path rather than by the step that extracts
  # it. `extract_dataset` selects by `dct:type` and is covered in
  # dsp_step_by_step.yaml; this reads the same list positionally, which is
  # what a script does when it already knows the catalog holds one answer.
  - id: first_offer
    uses: util/validate_path
    name: Read the single offer out of the filtered catalog
    with:
      input: "${{ execution.catalog_by_asset.datasets }}"
      path: "0"
    returns:
      value:
        type: object
    validate:
      - uses: validate/assert
        with: { input: value, operator: not_null }

  # Catalog, negotiation and transfer as one call. `pull_data_filtered` does
  # the same journey and reports every stage of it; this one reports only the
  # two things a data-plane call needs, which is the whole difference between
  # them and the reason a script would choose it.
  - id: one_shot_flow
    uses: connector/consumer/do_dsp
    name: Run the whole DSP flow in a single step
    with:
      counter_party_address: "${{ infrastructure.sut.connector.dsp_url }}"
      counter_party_id: "${{ infrastructure.sut.connector.participant_id }}"
      filters:
        - operand_left: "https://w3id.org/edc/v0.0.1/ns/id"
          operator: "="
          operand_right: "${{ setup.create_asset.asset_id }}"
      # Stated rather than left out: with no policies the step asks the SDK to
      # accept an offer under an empty allow-list, which is not the same thing
      # as no preference.
      expected_policies: "${{ env.usage_policy }}"
    returns:
      dataplane_url:
        type: string
      edr_token:
        type: string
    validate:
      - uses: validate/assert
        with: { input: dataplane_url, operator: not_null }
      - uses: validate/assert
        with: { input: edr_token, operator: not_null }

  - id: fetch_one_shot
    uses: connector/dataplane/http_request
    name: Spend the EDR the one-shot flow produced
    with:
      dataplane_url: "${{ execution.one_shot_flow.dataplane_url }}"
      edr_token: "${{ execution.one_shot_flow.edr_token }}"
      method: GET
    validate:
      - uses: validate/assert
        with: { input: status_code, operator: equals, value: 200 }
      - uses: validate/assert
        with: { input: body, operator: not_null }

  # The strict variant: `pull_data_filtered` treats an omitted policy list as
  # "take the first offer", and this one refuses to run without one. Pointed
  # at the wizard-registered asset, so a green result also says that asset
  # reached the catalog and is negotiable — which no assertion on the
  # registration itself could show.
  - id: pull_wizard_asset
    uses: connector/consumer/pull_data_filtered_by_policy
    name: Pull the wizard-registered asset, accepting only the named policy
    with:
      counter_party_address: "${{ infrastructure.sut.connector.dsp_url }}"
      counter_party_id: "${{ infrastructure.sut.connector.participant_id }}"
      filters:
        - operand_left: "https://w3id.org/edc/v0.0.1/ns/id"
          operator: "="
          operand_right: "${{ setup.create_wizard_asset.asset_id }}"
      expected_policies: "${{ env.usage_policy }}"
    returns:
      asset_id:
        type: string
      agreement_id:
        type: string
      token_prefix:
        type: string
      dataplane_url:
        type: string
      edr_token:
        type: string
    validate:
      - uses: validate/assert
        with: { input: asset_id, operator: equals, value: testlab-e2e-wizard-asset }
      - uses: validate/assert
        with: { input: agreement_id, operator: not_null }
      # The redacted head of the token, which exists so a run can be read in a
      # log without the token being in it. Asserting it is not null is the only
      # check that says the step produced one at all.
      - uses: validate/assert
        with: { input: token_prefix, operator: not_null }

  - id: fetch_wizard_asset
    uses: connector/dataplane/http_request
    name: Fetch the wizard-registered asset through its data plane
    with:
      dataplane_url: "${{ execution.pull_wizard_asset.dataplane_url }}"
      edr_token: "${{ execution.pull_wizard_asset.edr_token }}"
      method: GET
    validate:
      - uses: validate/assert
        with: { input: status_code, operator: equals, value: 200 }

teardown:
  - id: delete_wizard_contract
    uses: connector/provider/delete_contract_definition
    name: Withdraw the wizard-form offer
    with:
      contract_definition_id: "${{ setup.create_wizard_contract.contract_definition_id }}"

  - id: delete_contract
    uses: connector/provider/delete_contract_definition
    name: Withdraw the document-form offer
    with:
      contract_definition_id: "${{ setup.create_contract.contract_definition_id }}"

  - id: delete_wizard_asset
    uses: connector/provider/delete_asset
    name: Remove the wizard-form asset
    with:
      asset_id: "${{ setup.create_wizard_asset.asset_id }}"

  - id: delete_asset
    uses: connector/provider/delete_asset
    name: Remove the document-form asset
    with:
      asset_id: "${{ setup.create_asset.asset_id }}"

  - id: delete_wizard_policy
    uses: connector/provider/delete_policy
    name: Remove the wizard-form access policy
    with:
      policy_id: "${{ setup.create_wizard_policy.policy_id }}"

  - id: delete_usage_policy
    uses: connector/provider/delete_policy
    name: Remove the SUT usage policy
    with:
      policy_id: "${{ setup.create_usage_policy.policy_id }}"

  - id: delete_access_policy
    uses: connector/provider/delete_policy
    name: Remove the SUT access policy
    with:
      policy_id: "${{ setup.create_access_policy.policy_id }}"
