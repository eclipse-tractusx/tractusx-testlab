## This code was partially generated using artificial intelligence (AI) (Tool: Codex, Model: GPT-5.6 Sol).
## It was reviewed and tested by a human committer.

# Self-hosted smoke TCK for the `.github/workflows/e2e-umbrella.yml` pipeline.
#
# Purpose: exercise testlab's own compile -> validate -> run pipeline against
# two REAL Eclipse Tractus-X EDC connectors and a real Digital Twin Registry,
# deployed ephemerally in CI via the Tractus-X Umbrella "decentralized
# identityhub" profile (see docs/README.md in this directory). It is not a
# business-capability certification TCK — it certifies testlab itself.
#
# The connector test provisions its SUT asset, policies and contract in setup,
# then removes them in teardown. This exercises testlab's provider steps as
# well as the consumer-side DSP negotiation and data transfer.

kind: tck
syntax: v1-alpha

id: testlab-e2e-connector-dtr-smoke

metadata:
  name: "TestLab E2E Smoke — Connector & DTR"
  version: "v1.0.0"
  description: >
    Round-trips a real DSP contract negotiation and a real Digital Twin
    Registry write/read against the two EDC connectors + DTR that
    e2e-umbrella.yml deploys via Tractus-X Umbrella. Used as testlab's own
    CI signal, not as a published certification TCK.
  authors:
    - name: TestLab Maintainers
      email: testlab@eclipse-tractusx.org
      company: Eclipse Tractus-X
  copyright_holders:
    - "2026 Contributors to the Eclipse Foundation"
  license: Apache-2.0
  standards:
    - id: TESTLAB-INTERNAL
      version: v1.0.0
  tags:
    - internal
    - e2e
    - smoke

dataspace:
  ecosystem: Catena-X
  version: saturn

infrastructure:
  engine:
    connector:
      required: true
  sut:
    connector:
      required: true
    dtr:
      required: true

env:
  variables:
    - id: test_asset
      uses: config/connector/asset
      name: E2E HTTP test asset
      with:
        source: value
        value:
          asset_id: testlab-e2e-smoke-asset
          base_url: "http://tck-echo.umbrella.svc.cluster.local"
          dct_type: "https://w3id.org/catenax/taxonomy#TestData"
          version: "1.0"
      returns:
        value:
          type: object
          class: Asset

    # `action: access`, not `use`: the connector reads the action to decide
    # which half of the Catena-X policy profile a definition is held to. A
    # policy whose permission says `use` is an offer's *usage* policy, and the
    # profile then requires FrameworkAgreement and UsagePurpose on it — which
    # is not what a catalog access rule says, and not what this one is for.
    - id: access_policy
      uses: config/connector/policy
      name: Membership access policy
      with:
        source: value
        value:
          policy_id: testlab-e2e-smoke-access-policy
          permissions:
            - action: access
              constraints:
                - left_operand: Membership
                  operator: eq
                  right_operand: active
      returns:
        value:
          type: object
          class: Policy

    - id: stepwise_asset
      uses: config/connector/asset
      name: A second HTTP test asset, for the step-by-step DSP journey
      with:
        source: value
        value:
          asset_id: testlab-e2e-stepwise-asset
          base_url: "http://tck-echo.umbrella.svc.cluster.local"
          dct_type: "https://w3id.org/catenax/taxonomy#TestData"
          version: "1.0"
      returns:
        value:
          type: object
          class: Asset

    # A usage policy the Catena-X 2025/9 profile accepts: its permission must
    # carry at least FrameworkAgreement and UsagePurpose, or the connector
    # refuses the definition outright. Membership rides along because a real
    # offer carries it too.
    - id: usage_policy
      uses: config/connector/policy
      name: Framework-agreement usage policy
      with:
        source: value
        value:
          policy_id: testlab-e2e-smoke-usage-policy
          permissions:
            - action: use
              constraints:
                - and:
                    - left_operand: Membership
                      operator: eq
                      right_operand: active
                    - left_operand: FrameworkAgreement
                      operator: eq
                      right_operand: "DataExchangeGovernance:1.0"
                    - left_operand: UsagePurpose
                      operator: isAnyOf
                      right_operand:
                        - "cx.core.digitalTwinRegistry:1"
      returns:
        value:
          type: object
          class: Policy

# Every entry is `skippable: true`. This is testlab's own CI signal rather than
# a certification TCK, so the operator is allowed to run any subset — which is
# also what lets the workflow execute several *combinations* of one compiled
# package (`--var skip_tests=...`) instead of compiling a package per shape. A
# published certification TCK would leave these false, and the engine would
# then refuse to omit anything.
tests:
  - id: connector_negotiation.yaml
    name: Negotiate and pull data across the two live EDC connectors
    skippable: true
  - id: dsp_step_by_step.yaml
    name: Drive the same DSP journey as six wired steps
    skippable: true
  - id: dtr_roundtrip.yaml
    name: Write and read back a shell descriptor on the SUT's Digital Twin Registry
    skippable: true
  - id: negative_paths.yaml
    name: Ask for things that are not there, and check the answers say so
    skippable: true
